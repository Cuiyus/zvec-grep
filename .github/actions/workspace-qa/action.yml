name: Run original Workspace Lite CN QA task
description: One frozen full-workspace task, paired Qoder trials, blind rubric judge
inputs:
  task-id:
    required: true
    description: Locked upstream task ID
  repetitions:
    required: true
    description: Repetitions per arm
  phase:
    required: true
    description: smoke or batch (artifact namespace)
  qoder-token:
    required: true
    description: Existing Qoder CI personal access token
  judge-key:
    required: true
    description: Existing GLM judge key
  embedding-key:
    required: true
    description: Model Studio workspace key for remote Qwen3.7 text embedding
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install frozen Python dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - name: Reserve disk for complete original persona workspace
      shell: bash
      run: |
        # Allow the largest selected corpus, Git snapshot, caches and build scratch.
        # Avoid a minute of SDK deletion when the ephemeral runner already has room.
        if python - <<'PY'
        import os, shutil, sys
        free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
        print('Available disk bytes before cleanup:', free)
        sys.exit(0 if free >= 48 * 1024**3 else 1)
        PY
        then
          echo 'Disk budget already available; skipping unused SDK cleanup.'
        else
          # Unused preinstalled SDKs on this ephemeral runner, never user files.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        fi
        df -h "$RUNNER_TEMP"
    - uses: actions/checkout@v6
      with:
        repository: OpenDataBox/Workspace-Bench
        ref: 3fbd0f1a136720fece86786545983e26642c3db2
        path: .workspace-bench-upstream
        persist-credentials: false
    - name: Build pinned zg and Qoder runtime
      shell: bash
      run: >-
        docker build --build-arg QA_UID="$(id -u)" --build-arg QA_GID="$(id -g)"
        -f benchmarks/swe-qa-bench/runtime/Dockerfile
        -t zg-readonly-qa:0.2.2 benchmarks/swe-qa-bench
    - name: Read actual runtime identity for index compatibility
      shell: bash
      run: |
        uv run --project benchmarks/swe-qa-bench python - <<'PY'
        import json, os, sys
        from pathlib import Path
        sys.path.insert(0, 'benchmarks/workspace-qa')
        from runner import runtime_identity
        target = Path(os.environ['RUNNER_TEMP']) / 'workspace-qa-runtime.json'
        target.write_text(json.dumps(runtime_identity('zg-readonly-qa:0.2.2')) + '\n')
        PY
    - name: Resolve immutable data and index cache keys
      id: cache-plan
      shell: bash
      env:
        TASK_ID: ${{ inputs.task-id }}
      run: >-
        python benchmarks/workspace-qa/ci_plan.py --task-id "$TASK_ID"
        --runtime-identity "$RUNNER_TEMP/workspace-qa-runtime.json"
        --cache-root "$RUNNER_TEMP/workspace-qa-cache" --github-output "$GITHUB_OUTPUT"
    - name: Restore validated workspace download blocks
      id: range-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.cache-plan.outputs.range_cache_path }}
        key: ${{ steps.cache-plan.outputs.range_cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.cache-plan.outputs.range_cache_key }}-
    - name: Restore completed immutable index seed
      id: index-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.cache-plan.outputs.index_cache_path }}
        key: ${{ steps.cache-plan.outputs.index_cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.cache-plan.outputs.index_cache_key }}-
    - name: Run pair series and blind rubric judge
      shell: bash
      env:
        TASK_ID: ${{ inputs.task-id }}
        REPETITIONS: ${{ inputs.repetitions }}
        QA_PHASE: ${{ inputs.phase }}
        QODER_PERSONAL_ACCESS_TOKEN: ${{ inputs.qoder-token }}
        GLM_API_KEY: ${{ inputs.judge-key }}
        QWEN_API_KEY: ${{ inputs.embedding-key }}
        WORKSPACE_QA_RANGE_CACHE: ${{ steps.cache-plan.outputs.range_cache_path }}
        WORKSPACE_QA_RANGE_CACHE_BYTES: ${{ steps.cache-plan.outputs.range_cache_bytes }}
        WORKSPACE_QA_INDEX_CACHE: ${{ steps.cache-plan.outputs.index_cache_path }}
      run: >-
        uv run --project benchmarks/swe-qa-bench python benchmarks/workspace-qa/run_task.py
        --task-id "$TASK_ID" --repetitions "$REPETITIONS" --phase "$QA_PHASE"
        --upstream "$GITHUB_WORKSPACE/.workspace-bench-upstream"
        --output "$RUNNER_TEMP/workspace-qa"
    # Cache generations let a failed partial download grow on a later run.
    # Restore prefixes include the COMPLETE compatibility hash; no cross-config fallback.
    - name: Check whether preparation produced new reusable cache content
      if: always() && steps.cache-plan.outcome == 'success'
      id: cache-save-plan
      shell: bash
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'workspace-qa'
        def read(relative):
            path = root / relative
            return json.loads(path.read_text()) if path.is_file() else {}
        ranges = read('dataset/range-cache-metrics.json')
        preparation = read('runs/preparation/runtime/preparation.json')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('save_range=' + str(ranges.get('persisted_bytes', 0) > 0).lower() + '\n')
            output.write('save_index=' + str(preparation.get('cache', {}).get('published') is True).lower() + '\n')
        PY
    # Split restore/save: useful preparation survives a later SDK, QA or judge failure.
    # Answers, traces and trial working copies never enter either cache.
    - name: Save workspace blocks even when later evaluation fails
      if: always() && steps.cache-save-plan.outputs.save_range == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-plan.outputs.range_cache_path }}
        key: ${{ steps.cache-plan.outputs.range_cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Save completed index seed even when later evaluation fails
      if: always() && steps.cache-save-plan.outputs.save_index == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-plan.outputs.index_cache_path }}
        key: ${{ steps.cache-plan.outputs.index_cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Publish task summary
      if: always()
      shell: bash
      env:
        RANGE_CACHE_HIT: ${{ steps.range-cache.outputs.cache-matched-key != '' }}
        INDEX_CACHE_HIT: ${{ steps.index-cache.outputs.cache-matched-key != '' }}
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'workspace-qa'
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('### Preparation cache\n\n')
            summary.write('Actions archive restored: range=' + os.environ.get('RANGE_CACHE_HIT', '') + ', index=' + os.environ.get('INDEX_CACHE_HIT', '') + '. Content validation is recorded separately below.\n\n')
            for relative in ('dataset/range-cache-metrics.json', 'runs/preparation/runtime/preparation.json'):
                path = root / relative
                if path.is_file():
                    data = json.loads(path.read_text())
                    if 'cache' in data:
                        cache = data['cache']
                        data = {key: data[key] for key in ('status', 'wall_seconds', 'preflight_wall_seconds') if key in data}
                        data['cache'] = {key: cache[key] for key in ('status', 'validation_seconds', 'published') if key in cache}
                        data['cache']['original_build_wall_seconds'] = cache.get('original_build_info', {}).get('wall_seconds')
                    summary.write('`' + relative + '`\n\n```json\n' + json.dumps(data, ensure_ascii=False, indent=2) + '\n```\n\n')
        PY
        if [ -f "$RUNNER_TEMP/workspace-qa/report/summary.md" ]; then
          cat "$RUNNER_TEMP/workspace-qa/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Verify artifacts contain no CI credentials
      if: always()
      id: artifact-safety
      shell: bash
      env:
        QODER_PERSONAL_ACCESS_TOKEN: ${{ inputs.qoder-token }}
        GLM_API_KEY: ${{ inputs.judge-key }}
        QWEN_API_KEY: ${{ inputs.embedding-key }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'workspace-qa'
        secrets = [os.environ[k].encode() for k in ('QODER_PERSONAL_ACCESS_TOKEN','GLM_API_KEY','QWEN_API_KEY') if os.environ.get(k)]
        for folder in ('runs','report','sdk-preflight'):
            for path in (root / folder).rglob('*'):
                if not path.is_file() or 'working-indexes' in path.parts or 'model-cache' in path.parts or 'index' in path.parts:
                    continue
                data = path.read_bytes()
                if any(secret in data for secret in secrets):
                    raise SystemExit('Credential found in artifact; upload blocked')
        PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.artifact-safety.outcome == 'success'
      with:
        name: workspace-qa-${{ inputs.phase }}-${{ inputs.task-id }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 30
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/workspace-qa/planned.json
          ${{ runner.temp }}/workspace-qa/setup-failure.json
          ${{ runner.temp }}/workspace-qa/smoke_validation.json
          ${{ runner.temp }}/workspace-qa/embedding-preflight.json
          ${{ runner.temp }}/workspace-qa/sdk-preflight/runtime/
          ${{ runner.temp }}/workspace-qa/sdk-preflight/qoder/
          ${{ runner.temp }}/workspace-qa/selection.json
          ${{ runner.temp }}/workspace-qa/dataset/dataset-manifest.json
          ${{ runner.temp }}/workspace-qa/dataset/range-cache-metrics.json
          ${{ runner.temp }}/workspace-qa/report/
          ${{ runner.temp }}/workspace-qa/runs/*.json
          ${{ runner.temp }}/workspace-qa/runs/judge/
          ${{ runner.temp }}/workspace-qa/runs/*-r*/
          ${{ runner.temp }}/workspace-qa/runs/preparation/runtime/
