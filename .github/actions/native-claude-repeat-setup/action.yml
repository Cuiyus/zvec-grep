name: Prepare pinned native Claude QA repeat runtime
description: Provider-free setup shared by preflight and each fresh pair job.
inputs:
  pair_key:
    description: Fixed pair key or preflight
    required: true
runs:
  using: composite
  steps:
  - name: Set isolated runtime paths
    run: |
      set -euo pipefail
      case "$REPEAT_PAIR_KEY" in
        preflight|q001-r0[1-9]|q001-r10|q002-r0[1-9]|q002-r10|q003-r0[1-9]|q003-r10) ;;
        *) exit 1 ;;
      esac
      mkdir -p "$RUNNER_TEMP/native-claude-repeat-v1-$REPEAT_PAIR_KEY"
      cp benchmarks/native-claude-qa-pilot/repeat-plan-v1.json "$RUNNER_TEMP/native-claude-repeat-v1-$REPEAT_PAIR_KEY/"
      cp benchmarks/native-claude-qa-pilot/repeat-decision-v1.json "$RUNNER_TEMP/native-claude-repeat-v1-$REPEAT_PAIR_KEY/"
      cat >> "$GITHUB_ENV" <<EOF
      MAIN_ROOT=$RUNNER_TEMP/qa-main/benchmarks/swe-qa-bench
      REFERENCE_PREPARED_ROOT=$RUNNER_TEMP/qa-prepared
      PREPARED_GROUP_ROOT=$RUNNER_TEMP/qa-reserve-group
      REPAIR_ROOT=$RUNNER_TEMP/native-claude-repeat-v1-$REPEAT_PAIR_KEY
      EOF
    env:
      REPEAT_PAIR_KEY: ${{ inputs.pair_key }}
    shell: bash
  - uses: actions/setup-python@v6
    with:
      python-version: '3.12'
  - uses: actions/setup-node@v6
    with:
      node-version: '24'
  - name: Export the pinned upstream harness and source
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      set -euo pipefail
      expected=a424e0ce06868dc9ad8f142f57de59b8f9b58699
      git init "$RUNNER_TEMP/qa-main-git"
      git -C "$RUNNER_TEMP/qa-main-git" fetch --depth=1 https://github.com/zvec-ai/zvec-grep.git "$expected"
      test "$(git -C "$RUNNER_TEMP/qa-main-git" rev-parse FETCH_HEAD)" = "$expected"
      mkdir -p "$RUNNER_TEMP/qa-main" "$REPAIR_ROOT"
      git -C "$RUNNER_TEMP/qa-main-git" archive "$expected" benchmarks/swe-qa-bench benchmarks/shared/rust-package-cache.mjs | tar -x -C "$RUNNER_TEMP/qa-main"
      git init "$RUNNER_TEMP/qa-zvec-git"
      for revision in ec8a78ee08b14a0b8c94158ffc1de42cd3f97f6d e906168cc19378358d8fa1c1559f48e4b920aa37 68078e55e7ae9d705b8829b5d416e022060bebf7; do
        git -C "$RUNNER_TEMP/qa-zvec-git" fetch --depth=1 https://github.com/alibaba/zvec.git "$revision"
      done
      python -m pip install --disable-pip-version-check uv==0.9.17
      uv sync --project "$MAIN_ROOT" --frozen
      echo "PYTHONPATH=$GITHUB_WORKSPACE/benchmarks/native-claude-qa-pilot:$GITHUB_WORKSPACE/benchmarks/opencode-qa-pilot:$MAIN_ROOT" >> "$GITHUB_ENV"
      echo "QA_MAIN_ROOT=$MAIN_ROOT" >> "$GITHUB_ENV"
    shell: bash
  - name: Verify immutable native inputs
    run: |
      set -euo pipefail
      "$MAIN_ROOT/.venv/bin/python" -c 'import os; from pathlib import Path; from native_claude.integration import validate_inputs; validate_inputs(Path(os.environ["GITHUB_WORKSPACE"]),Path(os.environ["MAIN_ROOT"]))'
      cp benchmarks/native-claude-qa-pilot/inputs.json "$REPAIR_ROOT/inputs.json"
      cp benchmarks/native-claude-qa-pilot/decision.json "$REPAIR_ROOT/decision.json"
      docker version > "$REPAIR_ROOT/docker-version.txt"
    shell: bash
  - name: Read the existing upstream Rust artifact
    uses: actions/download-artifact@v8
    with:
      repository: zvec-ai/zvec-grep
      run-id: 39221698769
      name: rust-native-linux-x64-gnu
      github-token: ${{ github.token }}
      path: ${{ runner.temp }}/rust-native
  - name: Derive the install-compatible archive without rebuilding Rust
    run: |
      set -euo pipefail
      export QA_ORIGINAL_TGZ="$RUNNER_TEMP/rust-native/zvec-zvec-grep-linux-x64-gnu-0.0.1.tgz"
      echo "QA_ORIGINAL_TGZ=$QA_ORIGINAL_TGZ" >> "$GITHUB_ENV"
      "$MAIN_ROOT/.venv/bin/python" -m repair_v2.package \
        --source "$QA_ORIGINAL_TGZ" --output "$REPAIR_ROOT/zg-install.tgz" \
        --manifest "$REPAIR_ROOT/package-derivation.json"
    shell: bash
  - name: Prepare the unchanged full q001 source-only image
    run: |
      set -euo pipefail
      "$MAIN_ROOT/.venv/bin/python" benchmarks/opencode-qa-pilot/pilot.py \
        --plan benchmarks/opencode-qa-pilot/experiment.json \
        --repo-root "$GITHUB_WORKSPACE" --main-root "$MAIN_ROOT" \
        prepare --zvec-repo "$RUNNER_TEMP/qa-zvec-git" --output "$REFERENCE_PREPARED_ROOT"
    shell: bash
  - name: Prepare both original reserve tasks from the pinned template
    run: |
      set -euo pipefail
      "$MAIN_ROOT/.venv/bin/python" -c 'import os; from pathlib import Path; import expansion_v1; expansion_v1.prepare(Path(os.environ["REFERENCE_PREPARED_ROOT"]), Path(os.environ["RUNNER_TEMP"])/"qa-zvec-git", Path(os.environ["PREPARED_GROUP_ROOT"]))'
    shell: bash
  - name: Retain unchanged task and repetition inputs
    shell: bash
    run: |
      set -euo pipefail
      cp benchmarks/native-claude-qa-pilot/repeat-plan-v1.json "$REPAIR_ROOT/repeat-plan-v1.json"
      cp benchmarks/native-claude-qa-pilot/repeat-decision-v1.json "$REPAIR_ROOT/repeat-decision-v1.json"
      cp benchmarks/native-claude-qa-pilot/live-plan-v2.json "$REPAIR_ROOT/live-plan-v2.json"
      cp "$REFERENCE_PREPARED_ROOT/prepared.json" "$REPAIR_ROOT/q001-prepared.json"
      cp "$REFERENCE_PREPARED_ROOT/source-manifest.json" "$REPAIR_ROOT/q001-source-manifest.json"
      cp "$PREPARED_GROUP_ROOT/group.json" "$REPAIR_ROOT/prepared-group.json"
      for task in q002 q003; do
        cp "$PREPARED_GROUP_ROOT/$task/prepared.json" "$REPAIR_ROOT/$task-prepared.json"
        cp "$PREPARED_GROUP_ROOT/$task/source-manifest.json" "$REPAIR_ROOT/$task-source-manifest.json"
      done
