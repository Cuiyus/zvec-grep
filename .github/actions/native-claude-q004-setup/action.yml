name: Prepare pinned native Claude q004 runtime
description: Provider-free setup for the single q004 development pair.
inputs:
  stage:
    description: preflight or pilot
    required: true
runs:
  using: composite
  steps:
    - name: Set fresh runtime paths and retain controls
      shell: bash
      env:
        Q004_STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        case "$Q004_STAGE" in preflight|pilot) ;; *) exit 1 ;; esac
        root="$RUNNER_TEMP/native-claude-q004-v1-$Q004_STAGE"
        mkdir -p "$root"
        cp benchmarks/native-claude-qa-pilot/architecture-live-plan-v1.json "$root/"
        cp benchmarks/native-claude-qa-pilot/architecture-execution-decision-v1.json "$root/"
        cp benchmarks/native-claude-qa-pilot/architecture-grader-contract-v1.json "$root/"
        cat >> "$GITHUB_ENV" <<EOF
        MAIN_ROOT=$RUNNER_TEMP/qa-main/benchmarks/swe-qa-bench
        REFERENCE_PREPARED_ROOT=$RUNNER_TEMP/qa-prepared
        PREPARED_GROUP_ROOT=$RUNNER_TEMP/qa-architecture
        REPAIR_ROOT=$root
        EOF
    - name: Verify current main Rust before using the pinned binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/zvec-ai/zvec-grep/commits/main > "$REPAIR_ROOT/current-upstream.json"
        current=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["REPAIR_ROOT"])/"current-upstream.json").read_text())["sha"])')
        gh api "repos/zvec-ai/zvec-grep/git/trees/$current" > "$REPAIR_ROOT/current-upstream-tree.json"
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        tree = json.loads((Path(os.environ['REPAIR_ROOT'])/'current-upstream-tree.json').read_text())
        assert next(item['sha'] for item in tree['tree'] if item['path']=='rust') == 'de02030056a3224012725799d845bf2be9edae2b', 'current upstream Rust changed'
        PY
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Export the pinned harness and required source commits
      shell: bash
      run: |
        set -euo pipefail
        expected=a424e0ce06868dc9ad8f142f57de59b8f9b58699
        git init "$RUNNER_TEMP/qa-main-git"
        git -C "$RUNNER_TEMP/qa-main-git" fetch --depth=1 https://github.com/zvec-ai/zvec-grep.git "$expected"
        test "$(git -C "$RUNNER_TEMP/qa-main-git" rev-parse FETCH_HEAD)" = "$expected"
        mkdir -p "$RUNNER_TEMP/qa-main"
        git -C "$RUNNER_TEMP/qa-main-git" archive "$expected" benchmarks/swe-qa-bench benchmarks/shared/rust-package-cache.mjs | tar -x -C "$RUNNER_TEMP/qa-main"
        git init "$RUNNER_TEMP/qa-zvec-git"
        for revision in ec8a78ee08b14a0b8c94158ffc1de42cd3f97f6d 1a573058b24e11cdb7e91f27d6638c5f1c0cdcaa; do
          git -C "$RUNNER_TEMP/qa-zvec-git" fetch --depth=1 https://github.com/alibaba/zvec.git "$revision"
        done
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project "$MAIN_ROOT" --frozen
        echo "PYTHONPATH=$GITHUB_WORKSPACE/benchmarks/native-claude-qa-pilot:$GITHUB_WORKSPACE/benchmarks/opencode-qa-pilot:$MAIN_ROOT" >> "$GITHUB_ENV"
        echo "QA_MAIN_ROOT=$MAIN_ROOT" >> "$GITHUB_ENV"
    - name: Validate unchanged native inputs
      shell: bash
      run: |
        set -euo pipefail
        "$MAIN_ROOT/.venv/bin/python" -c 'import os; from pathlib import Path; from native_claude.integration import validate_inputs; validate_inputs(Path(os.environ["GITHUB_WORKSPACE"]),Path(os.environ["MAIN_ROOT"]))'
        cp benchmarks/native-claude-qa-pilot/inputs.json "$REPAIR_ROOT/inputs.json"
        cp benchmarks/native-claude-qa-pilot/live-plan-v2.json "$REPAIR_ROOT/live-plan-v2.json"
        docker version > "$REPAIR_ROOT/docker-version.txt"
    - name: Read existing upstream Rust build
      uses: actions/download-artifact@v8
      with:
        repository: zvec-ai/zvec-grep
        run-id: 39221698769
        name: rust-native-linux-x64-gnu
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/rust-native
    - name: Derive install archive without rebuilding Rust
      shell: bash
      run: |
        set -euo pipefail
        export QA_ORIGINAL_TGZ="$RUNNER_TEMP/rust-native/zvec-zvec-grep-linux-x64-gnu-0.0.1.tgz"
        echo "QA_ORIGINAL_TGZ=$QA_ORIGINAL_TGZ" >> "$GITHUB_ENV"
        "$MAIN_ROOT/.venv/bin/python" -m repair_v2.package \
          --source "$QA_ORIGINAL_TGZ" --output "$REPAIR_ROOT/zg-install.tgz" \
          --manifest "$REPAIR_ROOT/package-derivation.json"
    - name: Prepare canonical template reference and q004
      shell: bash
      run: |
        set -euo pipefail
        "$MAIN_ROOT/.venv/bin/python" benchmarks/opencode-qa-pilot/pilot.py \
          --plan benchmarks/opencode-qa-pilot/experiment.json --repo-root "$GITHUB_WORKSPACE" --main-root "$MAIN_ROOT" \
          prepare --zvec-repo "$RUNNER_TEMP/qa-zvec-git" --output "$REFERENCE_PREPARED_ROOT"
        "$MAIN_ROOT/.venv/bin/python" benchmarks/native-claude-qa-pilot/architecture_preparation_v1.py prepare \
          --reference-prepared "$REFERENCE_PREPARED_ROOT" --zvec-repo "$RUNNER_TEMP/qa-zvec-git" --output "$PREPARED_GROUP_ROOT"
        cp "$REFERENCE_PREPARED_ROOT/prepared.json" "$REPAIR_ROOT/q001-reference-prepared.json"
        cp "$PREPARED_GROUP_ROOT/group.json" "$REPAIR_ROOT/q004-prepared-group.json"
        cp "$PREPARED_GROUP_ROOT/q004/prepared.json" "$REPAIR_ROOT/q004-prepared.json"
        cp "$PREPARED_GROUP_ROOT/q004/source-manifest.json" "$REPAIR_ROOT/q004-source-manifest.json"
