name: Prepare unchanged five-question native QA runtime
description: Export the frozen harness and questions, and verify the current Rust candidate.
inputs:
  stage:
    description: offline, preflight, or a fixed pair key
    required: true
runs:
  using: composite
  steps:
    - name: Set isolated runtime paths
      shell: bash
      env:
        FIVE_STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        case "$FIVE_STAGE" in offline|preflight|q00[1-5]-r0[1-9]|q00[1-5]-r10) ;; *) exit 1 ;; esac
        mkdir -p "$RUNNER_TEMP/native-five-v1-$FIVE_STAGE"
        cat >> "$GITHUB_ENV" <<EOF
        MAIN_ROOT=$RUNNER_TEMP/qa-main/benchmarks/swe-qa-bench
        REFERENCE_PREPARED_ROOT=$RUNNER_TEMP/qa-prepared
        PREPARED_GROUP_ROOT=$RUNNER_TEMP/qa-five
        REPAIR_ROOT=$RUNNER_TEMP/native-five-v1-$FIVE_STAGE
        EOF
    - name: Verify current upstream Rust identity
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/zvec-ai/zvec-grep/commits/main > "$REPAIR_ROOT/current-upstream.json"
        tip=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["REPAIR_ROOT"])/"current-upstream.json").read_text())["sha"])')
        gh api "repos/zvec-ai/zvec-grep/git/trees/$tip" > "$REPAIR_ROOT/current-upstream-tree.json"
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        d=json.loads((Path(os.environ['REPAIR_ROOT'])/'current-upstream-tree.json').read_text())
        assert next(r['sha'] for r in d['tree'] if r['path']=='rust')=='577d1fd05902ba844bc9c85e2cc58d64f425252e','current upstream Rust changed'
        PY
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Export the preserved native harness and four immutable source revisions
      shell: bash
      run: |
        set -euo pipefail
        revision=a424e0ce06868dc9ad8f142f57de59b8f9b58699
        git init "$RUNNER_TEMP/qa-main-git"
        git -C "$RUNNER_TEMP/qa-main-git" fetch --depth=1 https://github.com/zvec-ai/zvec-grep.git "$revision"
        test "$(git -C "$RUNNER_TEMP/qa-main-git" rev-parse FETCH_HEAD)" = "$revision"
        mkdir -p "$RUNNER_TEMP/qa-main"
        git -C "$RUNNER_TEMP/qa-main-git" archive "$revision" benchmarks/swe-qa-bench benchmarks/shared/rust-package-cache.mjs | tar -x -C "$RUNNER_TEMP/qa-main"
        git init "$RUNNER_TEMP/qa-zvec-git"
        for source_revision in ec8a78ee08b14a0b8c94158ffc1de42cd3f97f6d e906168cc19378358d8fa1c1559f48e4b920aa37 68078e55e7ae9d705b8829b5d416e022060bebf7 1a573058b24e11cdb7e91f27d6638c5f1c0cdcaa; do
          git -C "$RUNNER_TEMP/qa-zvec-git" fetch --depth=1 https://github.com/alibaba/zvec.git "$source_revision"
        done
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project "$MAIN_ROOT" --frozen
        echo "PYTHONPATH=$GITHUB_WORKSPACE/benchmarks/native-claude-qa-pilot:$GITHUB_WORKSPACE/benchmarks/opencode-qa-pilot:$MAIN_ROOT" >> "$GITHUB_ENV"
        echo "QA_MAIN_ROOT=$MAIN_ROOT" >> "$GITHUB_ENV"
    - name: Verify the original native harness inputs
      shell: bash
      run: |
        set -euo pipefail
        "$MAIN_ROOT/.venv/bin/python" -c 'import os; from pathlib import Path; from native_claude.integration import validate_inputs; validate_inputs(Path(os.environ["GITHUB_WORKSPACE"]),Path(os.environ["MAIN_ROOT"]))'
        cp benchmarks/native-claude-qa-pilot/inputs.json "$REPAIR_ROOT/original-native-inputs.json"
        docker version > "$REPAIR_ROOT/docker-version.txt"
    - name: Read the current fork-built platform package
      uses: actions/download-artifact@v4
      with:
        repository: Cuiyus/zvec-grep
        run-id: 39388715134
        name: benchmark-current-rust-linux-x64-gnu
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/current-rust-build
    - name: Recreate and verify the exact metadata-only install archive
      shell: bash
      run: |
        set -euo pipefail
        provenance=benchmarks/native-claude-qa-pilot/provenance/current-rust-ae1ac57-v1
        "$MAIN_ROOT/.venv/bin/python" benchmarks/native-claude-qa-pilot/rust_candidate_v1.py derive \
          --source "$RUNNER_TEMP/current-rust-build/zvec-zvec-grep-linux-x64-gnu-0.0.1.tgz" \
          --source-pins "$provenance/source-pins.json" \
          --source-pins-sha256 4d85eda28a5fb9fd30ddf9cad40f1e9897a03c8a6561b1a8f1c12ff0edafa3fd \
          --output "$REPAIR_ROOT/zg-install.tgz" --derivation "$REPAIR_ROOT/package-derivation.json" \
          --candidate-manifest "$REPAIR_ROOT/candidate-manifest.json"
        "$MAIN_ROOT/.venv/bin/python" - <<'PY'
        import os
        from pathlib import Path
        from rust_candidate_v1 import digest
        assert digest(Path(os.environ['REPAIR_ROOT'])/'candidate-manifest.json')=='66deaa80a0028919c85219daeaee921285373a2f7f16f4b30154804ac9551d6f'
        PY
    - name: Prepare all five accepted questions without changing source or grading
      shell: bash
      run: |
        set -euo pipefail
        "$MAIN_ROOT/.venv/bin/python" benchmarks/opencode-qa-pilot/pilot.py \
          --plan benchmarks/opencode-qa-pilot/experiment.json --repo-root "$GITHUB_WORKSPACE" --main-root "$MAIN_ROOT" \
          prepare --zvec-repo "$RUNNER_TEMP/qa-zvec-git" --output "$REFERENCE_PREPARED_ROOT"
        "$MAIN_ROOT/.venv/bin/python" benchmarks/native-claude-qa-pilot/five_inputs_v1.py prepare \
          --reference-prepared "$REFERENCE_PREPARED_ROOT" --zvec-repo "$RUNNER_TEMP/qa-zvec-git" \
          --output "$PREPARED_GROUP_ROOT" > "$REPAIR_ROOT/five-task-references.json"
        "$MAIN_ROOT/.venv/bin/python" - <<'PY'
        import os,shutil
        from pathlib import Path
        import five_inputs_v1 as five
        root=Path(os.environ['REPAIR_ROOT']);group=Path(os.environ['PREPARED_GROUP_ROOT']);ref=Path(os.environ['REFERENCE_PREPARED_ROOT'])
        for task in five.TASK_IDS:
            _,_,selected=five.selected_inputs(group,ref,task)
            for filename in ('prepared.json','source-manifest.json'):
                shutil.copyfile(selected/filename,root/(task+'-'+filename))
        PY
