name: Install isolated index statistics reader
description: Pin a read-only native collection reader outside both candidate consumers.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - shell: bash
      if: env.INDEX_STATS_RUNTIME == 'node'
      run: |
        mkdir -p "$RUNNER_TEMP/index-statistics-sdk"
        npm install --prefix "$RUNNER_TEMP/index-statistics-sdk" --no-audit --no-fund --save-exact @zvec/zvec@0.7.1
        echo "INDEX_STATS_SDK=$RUNNER_TEMP/index-statistics-sdk/node_modules/@zvec/zvec/src/index.mjs" >> "$GITHUB_ENV"
        echo "INDEX_STATISTICS=1" >> "$GITHUB_ENV"
    - shell: bash
      if: env.INDEX_STATS_RUNTIME == 'rust'
      run: |
        mkdir -p "$RUNNER_TEMP/index-statistics-native"
        tar -xzf "$RUNNER_TEMP/package/candidate.tgz" -C "$RUNNER_TEMP/index-statistics-native"
        ZVEC_LIB_DIR="$RUNNER_TEMP/index-statistics-native/package/bin" \
          cargo build --release --manifest-path benchmarks/zg-retrieval/index-reader-rust/Cargo.toml
        echo "INDEX_STATS_RUST_READER=$GITHUB_WORKSPACE/benchmarks/zg-retrieval/index-reader-rust/target/release/zg-index-statistics-reader" >> "$GITHUB_ENV"
        echo "INDEX_STATISTICS=1" >> "$GITHUB_ENV"
