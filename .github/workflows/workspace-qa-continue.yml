name: Continue frozen Workspace QA trials
run-name: "Workspace QA · continue unstarted trials · ${{ github.ref_name }}"

on:
  push:
    branches: [dev/benchmark-qoder-qwen38-qa]
    paths: ['benchmarks/workspace-qa/data/continuation-dispatch.json']
  workflow_dispatch:

# This workflow resumes only the historical Qwen experiment.
env:
  WORKSPACE_QA_MODEL: qwen3.8-max

permissions:
  contents: read
  actions: read

concurrency:
  group: workspace-qa-native-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_pending: ${{ steps.plan.outputs.has_pending }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_run_attempt: ${{ steps.source.outputs.source_run_attempt }}
      selected_tasks: ${{ steps.plan.outputs.selected_tasks }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the historical Qwen task lock for continuation
        run: cp benchmarks/workspace-qa/data/qwen38-legacy-lock.json benchmarks/workspace-qa/data/lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate explicit dispatch and prevent automatic retries
        id: source
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path('benchmarks/workspace-qa/data')
          source = json.loads((folder / 'continuation-source.json').read_text())
          dispatch = json.loads((folder / 'continuation-dispatch.json').read_text())
          if int(os.environ['GITHUB_RUN_ATTEMPT']) != 1:
              raise SystemExit('Do not rerun this workflow: already attempted samples must be preserved.')
          if dispatch.get('source_run_id') != source['source_run_id'] or dispatch.get('source_commit') != source['source_commit']:
              raise SystemExit('Dispatch does not match the reviewed original experiment.')
          if os.environ['GITHUB_REF_NAME'] != source['branch']:
              raise SystemExit('Unexpected continuation branch.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('source_run_id=' + str(source['source_run_id']) + '\n')
              out.write('source_run_attempt=' + str(source['source_run_attempt']) + '\n')
              out.write('superseded_run_id=' + str(dispatch.get('superseded_no_qa_run_id', '')) + '\n')
          PY
      - name: Check original execution is over and no continuation already exists
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            -o "$RUNNER_TEMP/source-run.json"
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/workspace-qa-continue.yml/runs?per_page=100" \
            -o "$RUNNER_TEMP/continuation-runs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          original = json.loads((root / 'source-run.json').read_text())
          if original.get('status') != 'completed':
              raise SystemExit('Original execution is still active; no overlapping continuation is allowed.')
          runs = json.loads((root / 'continuation-runs.json').read_text())
          if runs.get('total_count', 0) > 100:
              raise SystemExit('Continuation history needs explicit review.')
          dispatch = json.loads(Path('benchmarks/workspace-qa/data/continuation-dispatch.json').read_text())
          allowed = {int(dispatch['superseded_no_qa_run_id'])} if dispatch.get('superseded_no_qa_run_id') else set()
          prior = dispatch.get('prior_verified_waves', [])
          if not isinstance(prior, list) or any(not isinstance(wave, dict) for wave in prior):
              raise SystemExit('prior_verified_waves must be a list of reviewed wave records.')
          prior_ids = []
          prior_tasks = set()
          selected = {str(task) for task in dispatch.get('selected_task_ids', [])}
          for wave in prior:
              try:
                  run_id = int(wave['run_id'])
              except (KeyError, TypeError, ValueError):
                  raise SystemExit('Each prior verified wave needs a positive run_id.')
              tasks = wave.get('task_ids')
              if (run_id <= 0 or not isinstance(tasks, list) or not tasks
                      or len(tasks) != len(set(map(str, tasks)))
                      or any(str(task) in prior_tasks or str(task) in selected for task in tasks)):
                  raise SystemExit('Prior wave tasks must be unique and disjoint from the selected wave.')
              prior_ids.append(run_id)
              prior_tasks.update(map(str, tasks))
          if len(prior_ids) != len(set(prior_ids)):
              raise SystemExit('Prior verified wave run IDs must be unique.')
          allowed.update(prior_ids)
          branch_runs = [run for run in runs['workflow_runs']
                    if run['id'] != int(os.environ['GITHUB_RUN_ID'])
                    and run.get('head_branch') == os.environ['GITHUB_REF_NAME']]
          indexed = {run['id']: run for run in branch_runs}
          if any(run_id not in indexed or indexed[run_id].get('status') != 'completed' for run_id in allowed):
              raise SystemExit('Declared superseded continuation is absent or still running.')
          for wave in prior:
              run = indexed[int(wave['run_id'])]
              if (run.get('conclusion') != 'success' or run.get('head_sha') != wave.get('head_sha')):
                  raise SystemExit('A declared prior wave is not the reviewed successful commit.')
          others = [run['id'] for run in branch_runs if run['id'] not in allowed]
          if others:
              raise SystemExit('Existing continuation runs require artifact review before any further execution: ' + str(others))

          # A successful run alone is insufficient: require the exact immutable
          # batch and report artifacts that its report job validated.
          import urllib.request
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json'}
          for wave in prior:
              run_id = int(wave['run_id'])
              url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                     + '/actions/runs/' + str(run_id) + '/artifacts?per_page=100')
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  document = json.load(response)
              if document.get('total_count', 0) > 100:
                  raise SystemExit('Prior wave artifact history needs explicit review.')
              artifacts = document.get('artifacts', [])
              names = [item.get('name') for item in artifacts]
              expected = {'workspace-qa-continuation-report-' + str(run_id) + '-1'}
              expected.update('workspace-qa-continuation-batch-' + str(task) + '-' + str(run_id) + '-1'
                              for task in wave['task_ids'])
              if any(names.count(name) != 1 for name in expected):
                  raise SystemExit('A prior wave is missing an exact batch or report artifact.')
              chosen = [item for item in artifacts if item.get('name') in expected]
              if any(item.get('expired') or not str(item.get('digest', '')).startswith('sha256:') for item in chosen):
                  raise SystemExit('A prior wave artifact is expired or lacks a content digest.')
          PY
      - name: Audit permitted code changes against original execution
        run: >-
          python benchmarks/workspace-qa/continuation_code_review.py
          --source-config benchmarks/workspace-qa/data/continuation-source.json
          --output "$RUNNER_TEMP/continuation-code-review.json"
      - name: Run offline regression tests
        run: python -m unittest discover -s benchmarks/workspace-qa/tests -v
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          pattern: workspace-qa-batch-*
          path: original
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.superseded_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.superseded_run_id }}
          pattern: workspace-qa-continuation-batch-*
          path: superseded
      - name: Prove the superseded workflow stopped before every QA trial
        if: steps.source.outputs.superseded_run_id != ''
        run: >-
          python benchmarks/workspace-qa/continue_ci.py audit-empty
          --artifacts superseded --run-id "${{ steps.source.outputs.superseded_run_id }}"
          --output "$RUNNER_TEMP/superseded-audit.json"
      - name: Freeze only never-started slots from original artifacts
        id: plan
        run: |
          python benchmarks/workspace-qa/continue_ci.py plan \
            --artifacts original --source-run-json "$RUNNER_TEMP/source-run.json" \
            --source-config benchmarks/workspace-qa/data/continuation-source.json \
            --dispatch benchmarks/workspace-qa/data/continuation-dispatch.json \
            --output "$RUNNER_TEMP/continuation-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'continuation-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(plan['matrix']) + '\n')
              out.write('has_pending=' + str(plan['has_pending']).lower() + '\n')
              out.write('selected_tasks=' + json.dumps(plan['selected_task_ids']) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Only original planned slots can execute. Original attempts and judge results remain fixed.\n\n```json\n')
              out.write(json.dumps(plan['counts'], indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-qa-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/continuation-code-review.json
            ${{ runner.temp }}/continuation-plan.json
            ${{ runner.temp }}/superseded-audit.json
          if-no-files-found: error

  continue:
    needs: plan
    if: needs.plan.outputs.has_pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the historical Qwen task lock for continuation
        run: cp benchmarks/workspace-qa/data/qwen38-legacy-lock.json benchmarks/workspace-qa/data/lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reverify checked-out code before model execution
        run: >-
          python benchmarks/workspace-qa/continuation_code_review.py
          --source-config benchmarks/workspace-qa/data/continuation-source.json
          --output "$RUNNER_TEMP/continuation-code-review.json"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
          name: workspace-qa-batch-${{ matrix.task }}-${{ needs.plan.outputs.source_run_id }}-${{ needs.plan.outputs.source_run_attempt }}
          path: ${{ runner.temp }}/original-task
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
          name: workspace-qa-batch-3-${{ needs.plan.outputs.source_run_id }}-${{ needs.plan.outputs.source_run_attempt }}
          path: ${{ runner.temp }}/source-preflight
      - uses: ./.github/actions/workspace-qa
        with:
          task-id: ${{ matrix.task }}
          repetitions: '10'
          phase: batch
          continue-from: ${{ matrix.mode == 'partial_trials' && format('{0}/original-task', runner.temp) || '' }}
          unstarted-from: ${{ matrix.mode == 'setup_only' && format('{0}/original-task', runner.temp) || '' }}
          continuation-source-config: ${{ github.workspace }}/benchmarks/workspace-qa/data/continuation-source.json
          shared-preflight: ${{ runner.temp }}/source-preflight
          continuation-code-review: ${{ runner.temp }}/continuation-code-review.json
          artifact-prefix: workspace-qa-continuation
          qoder-token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          judge-key: ${{ secrets.GLM_API_KEY }}
          embedding-key: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}

  report:
    needs: [plan, continue]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore the historical Qwen task lock for continuation
        run: cp benchmarks/workspace-qa/data/qwen38-legacy-lock.json benchmarks/workspace-qa/data/lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
          pattern: workspace-qa-batch-*
          path: original
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_pending == 'true'
        with:
          pattern: workspace-qa-continuation-batch-*
          path: continued
      - name: Validate preserved evidence for this selected wave
        run: >-
          python benchmarks/workspace-qa/continue_ci.py verify-wave
          --original original --continued continued --output wave
          --source-config benchmarks/workspace-qa/data/continuation-source.json
          --dispatch benchmarks/workspace-qa/data/continuation-dispatch.json
      - name: Require complete execution coverage for each selected task
        env:
          SELECTED_TASKS: ${{ needs.plan.outputs.selected_tasks }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          for task in json.loads(os.environ['SELECTED_TASKS']):
              root = Path('wave') / ('task-' + task)
              subprocess.run([sys.executable, 'benchmarks/workspace-qa/report.py',
                  '--runs-dir', str(root), '--manifest', str(root / 'selection.json'),
                  '--output', str(Path('report') / ('task-' + task)), '--require-executed'], check=True)
          PY
      - name: Audit original failures and execution coverage in this wave
        if: always()
        env:
          SELECTED_TASKS: ${{ needs.plan.outputs.selected_tasks }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          for task in json.loads(os.environ['SELECTED_TASKS']):
              root = Path('wave') / ('task-' + task)
              subprocess.run([sys.executable, 'benchmarks/workspace-qa/failure_audit.py',
                  '--runs-dir', str(root), '--manifest', str(root / 'selection.json'),
                  '--output', str(Path('report/failure-audit') / ('task-' + task))], check=True)
          PY
      - name: Publish execution coverage and quality separately
        if: always()
        run: |
          for summary in report/task-*/summary.md report/failure-audit/task-*/summary.md; do
            if [ -f "$summary" ]; then cat "$summary"; cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-qa-continuation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report/
            wave/wave.json
          if-no-files-found: error
