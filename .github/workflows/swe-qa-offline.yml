name: Qwen MCP schema fix verification
on:
  workflow_dispatch:
    inputs:
      fix_sha:
        description: Exact production fix commit to build
        required: true
        default: '9423a254856dd59c6c7ad6a499e1981007c19b92'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require development fork
        run: test "$GITHUB_REPOSITORY" = Cuiyus/zvec-grep
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.fix_sha }}
          path: candidate
          persist-credentials: false
      - name: Install pinned toolchain
        working-directory: candidate/rust
        run: rustup show active-toolchain
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            candidate/rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('candidate/rust/Cargo.lock', 'candidate/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Build exact candidate and test MCP adapter
        working-directory: candidate/rust
        run: |
          cargo test --locked -p zg-transport-mcp
          cargo build --locked -p zg
      - name: Capture wire schema and verify Qwen JSON and SSE arguments
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          FIX_SHA: ${{ inputs.fix_sha }}
        run: python3 benchmarks/mcp-schema-fix-validation/verify.py candidate/rust/target/debug/zg "$RUNNER_TEMP/schema-fix-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-schema-fix-evidence
          path: ${{ runner.temp }}/schema-fix-evidence
          if-no-files-found: error
          retention-days: 30
