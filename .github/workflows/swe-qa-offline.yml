name: SWE-QA Offline

on:
  pull_request:
    paths:
      - .github/workflows/swe-qa-bench.yml
      - .github/workflows/swe-qa-offline.yml
      - .github/workflows/zg-bench.yml
      - .github/workflows/retrieval-only.yml
      - .github/workflows/retrieval-pr.yml
      - .github/actions/retrieval-authorize/**
      - .github/scripts/bench-comment*.mjs
      - benchmarks/swe-qa-bench/**
      - benchmarks/shared/rust-package-cache.mjs
      - benchmarks/zg-retrieval/test/rust-package-cache.test.mjs
      - benchmarks/zg-retrieval/test/workflow.test.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/swe-qa-bench.yml
      - .github/workflows/swe-qa-offline.yml
      - .github/workflows/zg-bench.yml
      - .github/workflows/retrieval-only.yml
      - .github/workflows/retrieval-pr.yml
      - .github/actions/retrieval-authorize/**
      - .github/scripts/bench-comment*.mjs
      - benchmarks/swe-qa-bench/**
      - benchmarks/shared/rust-package-cache.mjs
      - benchmarks/zg-retrieval/test/rust-package-cache.test.mjs
      - benchmarks/zg-retrieval/test/workflow.test.mjs
  workflow_dispatch:

permissions: {}

concurrency:
  group: swe-qa-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline benchmark checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install locked benchmark environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Run offline benchmark tests
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m unittest discover
          -s benchmarks/swe-qa-bench/tests -v
      - name: Test shared Rust package identity helper
        run: node --test benchmarks/zg-retrieval/test/rust-package-cache.test.mjs
      - name: Test Benchmark comments and reusable Retrieval authorization
        run: node --test .github/scripts/bench-comment.test.mjs benchmarks/zg-retrieval/test/workflow.test.mjs

  retry-fixture:
    if: github.event_name == 'workflow_dispatch'
    name: Synthetic task reports / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [first, last]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Seed reports without model calls
        env:
          PYTHONPATH: benchmarks/swe-qa-bench
          FIXTURE_GROUP: ${{ matrix.group }}
        run: python benchmarks/swe-qa-bench/tests/ci_attempt_repro.py seed
      - uses: actions/upload-artifact@v7
        with:
          name: swe-qa-task-report-fixture-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture-reports/
          if-no-files-found: error

  retry-aggregate:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: retry-fixture
    name: Validate real cross-attempt artifact reuse (synthetic data)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: swe-qa-task-report-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/task-reports
      - name: Select reports and aggregate without model calls
        env:
          PYTHONPATH: benchmarks/swe-qa-bench
        run: python benchmarks/swe-qa-bench/tests/ci_attempt_repro.py aggregate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-retry-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate/
          if-no-files-found: error
