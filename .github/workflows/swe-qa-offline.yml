name: Qwen MCP schema fix verification
on:
  workflow_dispatch:
    inputs:
      fix_sha:
        description: Exact production fix commit to build
        required: true
        default: '9423a254856dd59c6c7ad6a499e1981007c19b92'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require development fork
        run: test "$GITHUB_REPOSITORY" = Cuiyus/zvec-grep
      - uses: actions/download-artifact@v8
        with:
          name: qwen-schema-fix-evidence
          run-id: '38043749383'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/captured-schema
      - name: Verify Qwen JSON and SSE using the exact binary's captured wire schema
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          FIX_SHA: ${{ inputs.fix_sha }}
          CAPTURED_EVIDENCE: ${{ runner.temp }}/captured-schema
        run: python3 benchmarks/mcp-schema-fix-validation/verify.py candidate/rust/target/debug/zg "$RUNNER_TEMP/schema-fix-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-schema-fix-evidence
          path: ${{ runner.temp }}/schema-fix-evidence
          if-no-files-found: error
          retention-days: 30
