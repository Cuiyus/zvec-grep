name: Qwen MCP schema diagnosis
run-name: Qwen MCP schema diagnosis / ${{ inputs.repetitions }} repetitions
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions per schema arm (1 to 5)
        required: true
        default: '5'
      schema_set:
        description: Controlled schema variants
        type: choice
        options: [primary, representations]
        default: primary
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require development fork
        run: test "$GITHUB_REPOSITORY" = Cuiyus/zvec-grep
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: version-package-rust
          run-id: '37933144986'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/schema-packages/rust
      - uses: actions/download-artifact@v8
        with:
          name: version-package-node
          run-id: '37933144986'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/schema-packages/node
      - name: Offline diagnostic tests
        run: python3 -m unittest discover -s benchmarks/mcp-schema-diagnosis -p 'test_*.py' -v
      - name: Verify frozen packages and install Node dependencies
        run: |
          python3 benchmarks/mcp-schema-diagnosis/diagnose.py prepare "$RUNNER_TEMP/schema-packages" "$RUNNER_TEMP/schema-evidence"
          npm install --global --prefix "$RUNNER_TEMP/node-cli" --omit=optional "$RUNNER_TEMP/schema-packages/node/candidate.tgz" @zvec/bindings-linux-x64@0.5.0
      - name: Capture actual MCP schemas and strict parsing behavior
        run: |
          node benchmarks/mcp-schema-diagnosis/capture-node.mjs "$RUNNER_TEMP/node-cli/lib/node_modules/@zvec/zvec-grep" "$RUNNER_TEMP/schema-evidence"
          python3 benchmarks/mcp-schema-diagnosis/diagnose.py capture "$RUNNER_TEMP/schema-packages" "$RUNNER_TEMP/schema-evidence"
      - name: Qwen calls with only schema types exchanged
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          DIAG_REPETITIONS: ${{ inputs.repetitions }}
          DIAG_SCHEMA_SET: ${{ inputs.schema_set }}
        run: python3 benchmarks/mcp-schema-diagnosis/diagnose.py model "$RUNNER_TEMP/schema-packages" "$RUNNER_TEMP/schema-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-mcp-schema-evidence
          path: ${{ runner.temp }}/schema-evidence
          if-no-files-found: error
          retention-days: 30
