      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Restore exact original FP32 index",
          "uses": "actions/cache/restore@v5",
          "with": {
            "path": "${{ runner.temp }}/swe-qa-index-seed",
            "key": "${{ matrix.fp32_key }}",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Measure immutable FP32 files",
          "run": "python3 benchmarks/pr284-index-size/measure.py --root \"$RUNNER_TEMP/swe-qa-index-seed\" --expected benchmarks/pr284-index-size/expected.json --task \"${{ matrix.task }}\" --variant fp32 --output \"$RUNNER_TEMP/index-measurement/${{ matrix.task }}-fp32.json\""
        },
        {
          "name": "Remove only restored temporary files",
          "run": "python3 - <<'PY_REMOVE'\nimport os, pathlib, shutil\np = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"swe-qa-index-seed\"\nassert p.name == \"swe-qa-index-seed\" and p.parent.is_dir()\nshutil.rmtree(p)\nPY_REMOVE"
        },
        {
          "name": "Restore exact original FP16 index",
          "uses": "actions/cache/restore@v5",
          "with": {
            "path": "${{ runner.temp }}/swe-qa-index-seed",
            "key": "${{ matrix.fp16_key }}",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Measure immutable FP16 files",
          "run": "python3 benchmarks/pr284-index-size/measure.py --root \"$RUNNER_TEMP/swe-qa-index-seed\" --expected benchmarks/pr284-index-size/expected.json --task \"${{ matrix.task }}\" --variant fp16 --output \"$RUNNER_TEMP/index-measurement/${{ matrix.task }}-fp16.json\""
        },
        {
          "name": "Preserve file sizes, identities and SHA-256 evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "pr284-index-size-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/index-measurement/",
            "if-no-files-found": "warn",
            "retention-days": 90
          }
        }
      ]
