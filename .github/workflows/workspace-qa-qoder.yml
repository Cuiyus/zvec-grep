name: Qoder GLM-5.2 Workspace QA
run-name: "GLM-5.2 · Workspace QA · ${{ inputs.scope || (contains(github.event.head_commit.message, '[workspace-qa-full]') && 'full' || contains(github.event.head_commit.message, '[workspace-qa-smoke]') && 'smoke' || contains(github.event.head_commit.message, '[workspace-qa-probe]') && 'probe' || contains(github.event.head_commit.message, '[workspace-qa-rejudge]') && 'rejudge' || 'validate') }} · ${{ github.ref_name }}"

on:
  push:
    branches: [dev/benchmark-qoder-qwen38-qa]
    paths:
      - 'benchmarks/workspace-qa/**'
      - '.github/actions/workspace-qa/**'
      - '.github/workflows/workspace-qa-qoder.yml'
      - 'benchmarks/swe-qa-bench/scripts/**'
      - 'benchmarks/swe-qa-bench/runtime/**'
      - 'benchmarks/swe-qa-bench/zg_bench/swe_qa/**'
      - 'benchmarks/swe-qa-bench/zg_bench/agents/qodercli.py'
      - 'benchmarks/swe-qa-bench/zg_bench/settings.py'
      - 'benchmarks/swe-qa-bench/tests/test_readonly_agents.py'
  workflow_dispatch:
    inputs:
      scope:
        description: Validate, probe, recover failed judging, one-task smoke, or 200 formal trials
        type: choice
        options: [validate, probe, rejudge, smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  # A long formal run must not queue unrelated fast validation behind it.
  group: workspace-qa-qoder-${{ github.ref }}-${{ inputs.scope || (contains(github.event.head_commit.message, '[workspace-qa-full]') && 'full' || contains(github.event.head_commit.message, '[workspace-qa-smoke]') && 'smoke' || contains(github.event.head_commit.message, '[workspace-qa-probe]') && 'probe' || contains(github.event.head_commit.message, '[workspace-qa-rejudge]') && 'rejudge' || 'validate') }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tasks: ${{ steps.matrix.outputs.tasks }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: scope
        name: Select explicitly requested execution scope
        run: python benchmarks/workspace-qa/ci_plan.py --event-path "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
      - name: Test dataset isolation, execution accounting, judge and reports
        run: |
          python -m unittest discover -s benchmarks/workspace-qa/tests -v
      - name: Verify the released Qoder global guidance loader
        env:
          ZG_QA_QODER_TEST_BUNDLE: ${{ runner.temp }}/qoder-mcp-package/package/bundle/qodercli.js
        run: |
          mkdir -p "$RUNNER_TEMP/qoder-mcp-package"
          npm pack @qoder-ai/qodercli@1.1.45 --pack-destination "$RUNNER_TEMP/qoder-mcp-package" --silent
          tar -xzf "$RUNNER_TEMP/qoder-mcp-package/"*.tgz -C "$RUNNER_TEMP/qoder-mcp-package"
          python -m unittest discover -s benchmarks/workspace-qa/tests -p test_native_session.py -v
      - id: matrix
        name: Freeze matrix before any model results
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'benchmarks/workspace-qa')
          import runner
          lock = json.loads(Path('benchmarks/workspace-qa/data/lock.json').read_text())
          tasks = [t['task_id'] for t in lock['tasks']]
          assert len(tasks) == len(set(tasks)) == 10
          assert lock['repetitions'] == 10 and lock['smoke_task_id'] == '3'
          assert lock['experiment']['embedding']['model'] == 'qwen/qwen3.7-text-embedding'
          assert lock['experiment']['zg_version'] == '0.2.2'
          assert lock['experiment']['requested_model'] == runner.MODEL == 'glm-5.2'
          assert lock['experiment']['protocol'] == runner.PROTOCOL
          assert lock['experiment']['index']['max_file_size_bytes'] == runner.INDEX_MAX_FILE_SIZE_BYTES == 1048576
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('tasks=' + json.dumps(tasks) + '\n')
          PY
  probe:
    needs: validate
    if: needs.validate.outputs.scope == 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen Python dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Build pinned zg and Qoder runtime
        run: >-
          docker build --build-arg QA_UID="$(id -u)" --build-arg QA_GID="$(id -g)"
          -f benchmarks/workspace-qa/Dockerfile
          -t zg-readonly-qa:0.2.2 benchmarks
      - name: Verify the CI account exposes GLM-5.2 before model generation
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/workspace-qa-probe"
          docker run --rm --env QODER_PERSONAL_ACCESS_TOKEN zg-readonly-qa:0.2.2 \
            qodercli --list-models > "$RUNNER_TEMP/workspace-qa-probe/qoder-models.txt"
          cat "$RUNNER_TEMP/workspace-qa-probe/qoder-models.txt"
          python - <<'PY'
          import os, re
          from pathlib import Path
          catalog = (Path(os.environ['RUNNER_TEMP']) / 'workspace-qa-probe/qoder-models.txt').read_text()
          if not re.search(r'(?i)\bGLM-5\.2\b', catalog):
              raise SystemExit('GLM-5.2 is absent from the CI account model catalog; automatic model fallback is forbidden.')
          PY
      - name: Check remote embedding and real Qoder MCP retrieval on one tiny file
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python benchmarks/workspace-qa/run_probe.py
          --output "$RUNNER_TEMP/workspace-qa-probe"
      - name: Publish setup-only result
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          result = Path(os.environ['RUNNER_TEMP']) / 'workspace-qa-probe/result.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Tiny integration probe\n\nSetup diagnostics only: zero benchmark trials, no full workspace download or rubric judge.\n\n')
              if result.is_file():
                  summary.write('```json\n' + result.read_text() + '\n```\n')
          PY
      - name: Verify probe artifacts contain no CI credentials
        if: always()
        id: artifact-safety
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'workspace-qa-probe'
          secrets = [os.environ[k].encode() for k in ('QODER_PERSONAL_ACCESS_TOKEN', 'QWEN_API_KEY') if os.environ.get(k)]
          for path in root.rglob('*'):
              if path.is_file() and 'index' not in path.parts and 'model-cache' not in path.parts:
                  if any(secret in path.read_bytes() for secret in secrets):
                      raise SystemExit('Credential found in artifact; upload blocked')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.artifact-safety.outcome == 'success'
        with:
          name: workspace-qa-probe-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/workspace-qa-probe/result.json
            ${{ runner.temp }}/workspace-qa-probe/qoder-models.txt
            ${{ runner.temp }}/workspace-qa-probe/embedding-preflight.json
            ${{ runner.temp }}/workspace-qa-probe/sdk-preflight/runtime/
            ${{ runner.temp }}/workspace-qa-probe/sdk-preflight/qoder/
            !${{ runner.temp }}/workspace-qa-probe/sdk-preflight/qoder/index/**
            !${{ runner.temp }}/workspace-qa-probe/sdk-preflight/qoder/model-cache/**
  rejudge:
    needs: validate
    if: needs.validate.outputs.scope == 'rejudge'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject legacy bridge judge recovery
        run: |
          echo 'Legacy bridge recovery cannot validate the standard zg install protocol.'
          exit 1

  smoke:
    needs: validate
    if: needs.validate.outputs.scope == 'smoke' || needs.validate.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Prior bridge smoke/rejudge artifacts cannot validate the native install protocol.
      - uses: ./.github/actions/workspace-qa
        with:
          task-id: '3'
          repetitions: '1'
          phase: smoke
          qoder-token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          judge-key: ${{ secrets.GLM_API_KEY }}
          embedding-key: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
  batch:
    needs: [validate, smoke]
    if: needs.validate.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJSON(needs.validate.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/workspace-qa
        with:
          task-id: ${{ matrix.task }}
          repetitions: '10'
          phase: batch
          qoder-token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          judge-key: ${{ secrets.GLM_API_KEY }}
          embedding-key: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
  report:
    needs: [validate, smoke, batch]
    if: always() && needs.validate.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: workspace-qa-batch-*
          path: results
      - name: Aggregate all 200 planned trials, including absent results
        run: >-
          python benchmarks/workspace-qa/report.py --runs-dir results
          --manifest benchmarks/workspace-qa/data/lock.json --output report
          --require-complete
      - name: Audit execution coverage and original failure evidence
        if: always()
        run: >-
          python benchmarks/workspace-qa/failure_audit.py --runs-dir results
          --manifest benchmarks/workspace-qa/data/lock.json --output report/failure-audit
      - name: Publish aggregate summary
        if: always()
        run: |
          if [ -f report/summary.md ]; then
            cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f report/failure-audit/summary.md ]; then
            cat report/failure-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-qa-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: report/
          if-no-files-found: error
