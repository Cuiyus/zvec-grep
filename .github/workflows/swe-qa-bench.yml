name: GLM local E2E - PR261 MAD + PR274 init
run-name: GLM-5.2 local round 3 - main20 x baseline/Node/Rust x 10 - init fix
'on':
  workflow_dispatch:
    inputs:
      task_scope:
        description: One main task for isolated recovery; empty runs all 20
        required: false
        default: ''
        type: string
permissions: {}
env:
  SWE_QA_MODEL_BASE_URL: ${{ vars.SWE_QA_MODEL_BASE_URL }}
concurrency:
  group: three-arm-e2e-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: "test \"$BENCH_REPOSITORY\" = Cuiyus/zvec-grep\nset -euo pipefail\nif [[ \"$BENCH_EVENT_NAME\" != \"\
        workflow_dispatch\" ]]; then\n  echo \"::error::SWE-QA Bench only accepts manual workflow_dispatch runs.\"\
        \n  exit 1\nfi\nif [[ -z \"$BENCH_ACTOR\" || -z \"$BENCH_TRIGGERING_ACTOR\" ]]; then\n  echo \"::error::Both\
        \ the original actor and the current triggering actor are required.\"\n  exit 1\nfi\nfor actor in \"$BENCH_ACTOR\"\
        \ \"$BENCH_TRIGGERING_ACTOR\"; do\n  # The legacy permission field maps maintain to write; use role_name.\n\
        \  role=\"$(gh api \"repos/$BENCH_REPOSITORY/collaborators/$actor/permission\" --jq '.role_name')\"\n  case\
        \ \"$role\" in\n    admin|maintain)\n      echo \"Authorized $actor with repository role $role.\"\n    \
        \  ;;\n    *)\n      echo \"::error::SWE-QA Bench requires the admin or maintain repository role; $actor\
        \ has $role.\"\n      exit 1\n      ;;\n  esac\ndone\n"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install locked harness
      run: 'python -m pip install --disable-pip-version-check uv==0.9.17

        uv sync --project benchmarks/swe-qa-bench --frozen

        '
    - name: Validate unchanged main corpus and PR statistics
      run: 'uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa validate --selection benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json
        --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json --dataset benchmarks/swe-qa-bench/datasets

        uv run --project benchmarks/swe-qa-bench python - <<''PYCODE''

        from zg_bench.native_baseline_e2e import validate_inputs

        print(validate_inputs())

        PYCODE

        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p
        test_three_arm_e2e.py -v

        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p
        test_trim_statistics.py -v

        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p
        test_glm_local_mad.py -v

        '
    - name: Build exact main task matrix
      id: matrix
      env:
        TASK_SCOPE: ${{ inputs.task_scope }}
      run: "python - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\ntasks=[t['task_slug'] for t in json.loads(Path('benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json').read_text())['tasks']]\n\
        assert len(tasks)==len(set(tasks))==20\nif os.environ['TASK_SCOPE']:\n    assert os.environ['TASK_SCOPE']\
        \ in tasks\n    tasks=[os.environ['TASK_SCOPE']]\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:\n   \
        \ print('matrix='+json.dumps({'task':tasks}),file=f)\nPYCODE\n"
    - name: Require configured GLM credential
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: test -n "$GLM_API_KEY"
  package-node:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: "test \"$BENCH_REPOSITORY\" = Cuiyus/zvec-grep\nset -euo pipefail\nif [[ \"$BENCH_EVENT_NAME\" != \"\
        workflow_dispatch\" ]]; then\n  echo \"::error::SWE-QA Bench only accepts manual workflow_dispatch runs.\"\
        \n  exit 1\nfi\nif [[ -z \"$BENCH_ACTOR\" || -z \"$BENCH_TRIGGERING_ACTOR\" ]]; then\n  echo \"::error::Both\
        \ the original actor and the current triggering actor are required.\"\n  exit 1\nfi\nfor actor in \"$BENCH_ACTOR\"\
        \ \"$BENCH_TRIGGERING_ACTOR\"; do\n  # The legacy permission field maps maintain to write; use role_name.\n\
        \  role=\"$(gh api \"repos/$BENCH_REPOSITORY/collaborators/$actor/permission\" --jq '.role_name')\"\n  case\
        \ \"$role\" in\n    admin|maintain)\n      echo \"Authorized $actor with repository role $role.\"\n    \
        \  ;;\n    *)\n      echo \"::error::SWE-QA Bench requires the admin or maintain repository role; $actor\
        \ has $role.\"\n      exit 1\n      ;;\n  esac\ndone\n"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Reuse exact node package from previous round
      uses: actions/download-artifact@v8
      with:
        name: three-arm-package-node
        run-id: 38700270964
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/package-node
    - name: Verify Node manifest, package and CLI fingerprints
      run: python benchmarks/version-comparison/verify_reused_package.py --directory "$RUNNER_TEMP/package-node"
        --variant node
    - uses: actions/upload-artifact@v7
      with:
        name: three-arm-package-node
        path: ${{ runner.temp }}/package-node/
        if-no-files-found: error
        retention-days: 30
  package-rust:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: "test \"$BENCH_REPOSITORY\" = Cuiyus/zvec-grep\nset -euo pipefail\nif [[ \"$BENCH_EVENT_NAME\" != \"\
        workflow_dispatch\" ]]; then\n  echo \"::error::SWE-QA Bench only accepts manual workflow_dispatch runs.\"\
        \n  exit 1\nfi\nif [[ -z \"$BENCH_ACTOR\" || -z \"$BENCH_TRIGGERING_ACTOR\" ]]; then\n  echo \"::error::Both\
        \ the original actor and the current triggering actor are required.\"\n  exit 1\nfi\nfor actor in \"$BENCH_ACTOR\"\
        \ \"$BENCH_TRIGGERING_ACTOR\"; do\n  # The legacy permission field maps maintain to write; use role_name.\n\
        \  role=\"$(gh api \"repos/$BENCH_REPOSITORY/collaborators/$actor/permission\" --jq '.role_name')\"\n  case\
        \ \"$role\" in\n    admin|maintain)\n      echo \"Authorized $actor with repository role $role.\"\n    \
        \  ;;\n    *)\n      echo \"::error::SWE-QA Bench requires the admin or maintain repository role; $actor\
        \ has $role.\"\n      exit 1\n      ;;\n  esac\ndone\n"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Reuse exact rust package from previous round
      uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        run-id: 38700270964
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/package-rust
    - name: Verify Rust manifest, package and CLI fingerprints
      run: python benchmarks/version-comparison/verify_reused_package.py --directory "$RUNNER_TEMP/package-rust"
        --variant rust
    - uses: actions/upload-artifact@v7
      with:
        name: three-arm-package-rust
        path: ${{ runner.temp }}/package-rust/
        if-no-files-found: error
        retention-days: 30
  task:
    name: Three arms / ${{ matrix.task }}
    needs:
    - validate
    - package-node
    - package-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: "test \"$BENCH_REPOSITORY\" = Cuiyus/zvec-grep\nset -euo pipefail\nif [[ \"$BENCH_EVENT_NAME\" != \"\
        workflow_dispatch\" ]]; then\n  echo \"::error::SWE-QA Bench only accepts manual workflow_dispatch runs.\"\
        \n  exit 1\nfi\nif [[ -z \"$BENCH_ACTOR\" || -z \"$BENCH_TRIGGERING_ACTOR\" ]]; then\n  echo \"::error::Both\
        \ the original actor and the current triggering actor are required.\"\n  exit 1\nfi\nfor actor in \"$BENCH_ACTOR\"\
        \ \"$BENCH_TRIGGERING_ACTOR\"; do\n  # The legacy permission field maps maintain to write; use role_name.\n\
        \  role=\"$(gh api \"repos/$BENCH_REPOSITORY/collaborators/$actor/permission\" --jq '.role_name')\"\n  case\
        \ \"$role\" in\n    admin|maintain)\n      echo \"Authorized $actor with repository role $role.\"\n    \
        \  ;;\n    *)\n      echo \"::error::SWE-QA Bench requires the admin or maintain repository role; $actor\
        \ has $role.\"\n      exit 1\n      ;;\n  esac\ndone\n"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-node
        path: ${{ runner.temp }}/packages/node
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        path: ${{ runner.temp }}/packages/rust
    - name: Install locked harness
      run: 'python -m pip install --disable-pip-version-check uv==0.9.17

        uv sync --project benchmarks/swe-qa-bench --frozen

        '
    - name: Run 10 fresh trials per group, rotating execution order
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        BENCH_TASK: ${{ matrix.task }}
        ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/three-arm-index-seeds
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.three_arm_e2e run --task "$BENCH_TASK" --packages
        "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/three-arm-evidence"
    - name: Scan evidence for credential leakage
      id: secret-scan
      if: always() && steps.authorize.outcome == 'success'
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.ci.secret_scan --secret-env GLM_API_KEY --root
        "$RUNNER_TEMP/three-arm-evidence"
    - name: Preserve all trials and failed attempts
      if: always() && steps.authorize.outcome == 'success' && steps.secret-scan.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: three-arm-evidence-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/three-arm-evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Preserve compact report
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: three-arm-report-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/three-arm-evidence/report/
        if-no-files-found: error
        retention-days: 90
  aggregate:
    name: Three-arm MAD report and previous-round comparison
    needs:
    - validate
    - task
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: "test \"$BENCH_REPOSITORY\" = Cuiyus/zvec-grep\nset -euo pipefail\nif [[ \"$BENCH_EVENT_NAME\" != \"\
        workflow_dispatch\" ]]; then\n  echo \"::error::SWE-QA Bench only accepts manual workflow_dispatch runs.\"\
        \n  exit 1\nfi\nif [[ -z \"$BENCH_ACTOR\" || -z \"$BENCH_TRIGGERING_ACTOR\" ]]; then\n  echo \"::error::Both\
        \ the original actor and the current triggering actor are required.\"\n  exit 1\nfi\nfor actor in \"$BENCH_ACTOR\"\
        \ \"$BENCH_TRIGGERING_ACTOR\"; do\n  # The legacy permission field maps maintain to write; use role_name.\n\
        \  role=\"$(gh api \"repos/$BENCH_REPOSITORY/collaborators/$actor/permission\" --jq '.role_name')\"\n  case\
        \ \"$role\" in\n    admin|maintain)\n      echo \"Authorized $actor with repository role $role.\"\n    \
        \  ;;\n    *)\n      echo \"::error::SWE-QA Bench requires the admin or maintain repository role; $actor\
        \ has $role.\"\n      exit 1\n      ;;\n  esac\ndone\n"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install locked harness
      run: 'python -m pip install --disable-pip-version-check uv==0.9.17

        uv sync --project benchmarks/swe-qa-bench --frozen

        '
    - uses: actions/download-artifact@v8
      with:
        pattern: three-arm-report-*
        path: ${{ runner.temp }}/task-reports
    - name: Recompute all task-weighted statistics without model calls
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.three_arm_e2e aggregate --reports "$RUNNER_TEMP/task-reports"
        --output "$RUNNER_TEMP/three-arm-comparison"
    - name: Download completed previous-round reports for comparison
      uses: actions/download-artifact@v8
      with:
        pattern: three-arm-report-*
        run-id: 38700270964
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/reference-reports
    - name: Compare rounds using one common six-group MAD mask
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.glm_local_mad --reference-reports "$RUNNER_TEMP/reference-reports"
        --repeat-reports "$RUNNER_TEMP/task-reports" --output "$RUNNER_TEMP/three-arm-comparison"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: three-arm-comparison-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/three-arm-comparison/
        if-no-files-found: error
        retention-days: 90
