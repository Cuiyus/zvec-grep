name: Qwen3.8-Max MCP description experiment
run-name: Qwen3.8-Max MCP descriptions ${{ inputs.phase }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        description: Package, smoke, formal, or approved six-generation schema-reference diagnostic
        required: true
        default: smoke
        type: choice
        options:
        - package
        - smoke
        - formal
        - schema-reference
      verified_package_run:
        description: Formal requires a successful smoke run whose exact native package is reused
        required: false
        default: ''
        type: string
permissions: {}
env:
  SWE_QA_MODEL_BASE_URL: ${{ vars.SWE_QA_MODEL_BASE_URL }}
  ZG_BENCH_DISABLE_SUBAGENTS: '1'
  MCP_DESCRIPTION_PACKAGE_RUN_ID: ${{ github.run_id }}
  MCP_VERIFIED_PACKAGE_RUN: ${{ inputs.verified_package_run }}
concurrency:
  group: qwen38-subagent-ablation-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install locked harness
      run: |
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - name: Install pinned OpenCode for real permission preflight
      id: opencode-guard
      run: |
        npm install --prefix "$RUNNER_TEMP/opencode-guard" --no-audit --no-fund opencode-ai@1.18.4
    - name: Validate frozen corpus and subagent ablation experiment contracts
      run: |
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa validate --selection benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json --dataset benchmarks/swe-qa-bench/datasets
        uv run --project benchmarks/swe-qa-bench python - <<'PYCODE'
        from zg_bench.native_baseline_e2e import validate_inputs
        print(validate_inputs())
        PYCODE
        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p 'test_qwen_subagent*.py' -v
        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p test_opencode_usage.py -v
        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p 'test_ripgrep*.py' -v
        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p 'test_rg_environment_probe.py' -v
        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p test_mcp_description.py -v
        uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -p test_mcp_schema_reference.py -v
      env:
        OPENCODE_TEST_BINARY: ${{ runner.temp }}/opencode-guard/node_modules/.bin/opencode
        OPENCODE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/no-subagent-permission-preflight
    - name: Preserve real OpenCode permission preflight
      if: always() && steps.authorize.outcome == 'success' && steps.opencode-guard.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: no-subagent-permission-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/no-subagent-permission-preflight/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    - name: Build fixed phase task matrix
      id: matrix
      env:
        BENCH_PHASE: ${{ inputs.phase }}
      run: |
        uv run --project benchmarks/swe-qa-bench python - <<'PYCODE'
        import json, os
        from zg_bench.mcp_description_e2e import selected_tasks
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print('matrix=' + json.dumps({'task': ([] if os.environ['BENCH_PHASE'] in ('package', 'schema-reference') else selected_tasks(os.environ['BENCH_PHASE']))}), file=output)
        PYCODE
    - name: Require configured Bailian Qwen credential
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: test -n "$GLM_API_KEY"
      if: inputs.phase != 'package'
  package-rust:
    if: inputs.phase != 'schema-reference'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Require successful smoke provenance before formal package reuse
      env:
        GH_TOKEN: ${{ github.token }}
        VERIFIED_PACKAGE_RUN: ${{ inputs.verified_package_run }}
        BENCH_PHASE: ${{ inputs.phase }}
      run: |-
        python3 - <<'PYCODE'
        import os,json,subprocess
        run_id=os.environ['VERIFIED_PACKAGE_RUN']
        if os.environ['BENCH_PHASE']=='formal':
         assert run_id, 'Formal evaluation requires a successful independent smoke run'
        if run_id:
         assert run_id.isdigit()
         source=json.loads(subprocess.check_output(['gh','api',f'repos/Cuiyus/zvec-grep/actions/runs/{run_id}'],text=True))
         assert source['repository']['full_name']=='Cuiyus/zvec-grep'
         assert source['head_branch']=='dev/e2e-mcp-query-description-qwen38-20261028'
         assert source['event']=='workflow_dispatch' and source['status']=='completed' and source['conclusion']=='success'
         assert source['display_title']=='Qwen3.8-Max MCP descriptions smoke'
         print('Reusing the exact package from verified smoke run',run_id,source['head_sha'])
        PYCODE
    - name: Download the exact smoke-verified native package
      if: inputs.verified_package_run != ''
      uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        run-id: ${{ inputs.verified_package_run }}
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/rust-package-cache
    - name: Build frozen Rust plus only MCP descriptions
      uses: ./.github/actions/rust-candidate-package
      with:
        candidate_repository: Cuiyus/zvec-grep
        candidate_ref: 0826415fc5a5029924567d2dcdecc2fc7ea271d9
        cache_namespace: sweqa-mcp-description-frozen
      if: inputs.verified_package_run == ''
    - name: Run actual generated-schema and string/list compatibility tests
      working-directory: candidate/rust
      run: cargo test --locked --release --package zg-transport-mcp --lib
      if: inputs.phase == 'package' && inputs.verified_package_run == ''
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        run-id: 38700270964
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/original-rust
    - name: Compare actual original and patched MCP schemas and instructions
      run: python3 benchmarks/version-comparison/capture_mcp_definitions.py --before "$RUNNER_TEMP/original-rust"
        --after "$RUNNER_TEMP/rust-package-cache" --output "$RUNNER_TEMP/mcp-schema-audit"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: mcp-schema-audit
        path: |
          ${{ runner.temp }}/mcp-schema-audit/*.json
          ${{ runner.temp }}/mcp-schema-audit/**/bridge.stderr
        if-no-files-found: error
        retention-days: 90
    - name: Record package and native CLI fingerprints
      run: |-
        python3 - <<'PYCODE'
        import os,json,hashlib,tarfile,sys
        sys.path.insert(0, "benchmarks/swe-qa-bench")
        from zg_bench.mcp_description_e2e import DESCRIPTION_SOURCE, EXPECTED_TARBALL_SHA, EXPECTED_CLI_SHA
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'rust-package-cache'
        m=json.loads((p/'manifest.json').read_text())
        with tarfile.open(p/'candidate.tgz') as archive:
         m['cli_sha256']=hashlib.file_digest(archive.extractfile('package/bin/zg'),'sha256').hexdigest()
        assert m['candidate_commit'] == DESCRIPTION_SOURCE
        if EXPECTED_TARBALL_SHA: assert m['tarball_sha256'] == EXPECTED_TARBALL_SHA
        if EXPECTED_CLI_SHA: assert m['cli_sha256'] == EXPECTED_CLI_SHA
        m['reused_from_run_id'] = os.environ.get('MCP_VERIFIED_PACKAGE_RUN') or None
        m['source_base']='732a44014654c7acf08553716af67865bcfb8430'
        m['description_source_commit']='0826415fc5a5029924567d2dcdecc2fc7ea271d9'
        Path(os.environ['RUNNER_TEMP'],'description-package-identity.json').write_text(json.dumps(m,indent=2)+'\n')
        print(json.dumps(m))
        PYCODE
    - uses: actions/upload-artifact@v7
      with:
        name: three-arm-package-rust
        path: ${{ runner.temp }}/rust-package-cache/
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@v7
      with:
        name: description-package-identity
        path: ${{ runner.temp }}/description-package-identity.json
        if-no-files-found: error
        retention-days: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
  task:
    name: Subagent availability / ${{ matrix.task }}
    needs:
    - validate
    - package-rust
    - format-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        path: ${{ runner.temp }}/packages/rust
    - name: Install locked harness
      run: |
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - name: Run fixed phase trials and audit every attempt before judging
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        BENCH_TASK: ${{ matrix.task }}
        ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/three-arm-index-seeds
        BENCH_PHASE: ${{ inputs.phase }}
      run: |
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_e2e prepare --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/three-arm-evidence/description-protocol"
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_e2e run --phase "$BENCH_PHASE" --task "$BENCH_TASK" --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/three-arm-evidence"
    - name: Scan evidence for credential leakage
      id: secret-scan
      if: always() && steps.authorize.outcome == 'success'
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.ci.secret_scan --secret-env GLM_API_KEY --root
        "$RUNNER_TEMP/three-arm-evidence"
    - name: Preserve all trials and failed attempts
      if: always() && steps.authorize.outcome == 'success' && steps.secret-scan.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: qwen38-subagent-ablation-${{ inputs.phase }}-evidence-${{ matrix.task }}-${{ github.run_id }}-${{
          github.run_attempt }}
        path: ${{ runner.temp }}/three-arm-evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    - name: Preserve compact report
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: qwen38-subagent-ablation-${{ inputs.phase }}-report-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/three-arm-evidence/report/
        if-no-files-found: error
        retention-days: 90
    if: always() && needs.validate.result == 'success' && needs.package-rust.result == 'success' && (inputs.phase
      == 'formal' || (inputs.phase == 'smoke' && needs.format-probe.result == 'success'))
  aggregate:
    name: Unfiltered subagent ablation report
    needs:
    - validate
    - task
    - package-rust
    if: always() && needs.validate.result == 'success' && (inputs.phase == 'smoke' || inputs.phase == 'formal')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        path: ${{ runner.temp }}/packages/rust
    - name: Install locked harness
      run: |
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - uses: actions/download-artifact@v8
      with:
        pattern: qwen38-subagent-ablation-${{ inputs.phase }}-report-*
        path: ${{ runner.temp }}/task-reports
    - name: Report all scheduled tasks without score or resource filtering
      run: |
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_e2e prepare --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/three-arm-evidence/description-protocol"
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_e2e aggregate --phase "$BENCH_PHASE" --reports "$RUNNER_TEMP/task-reports" --output "$RUNNER_TEMP/three-arm-comparison"
      env:
        BENCH_PHASE: ${{ inputs.phase }}
    - uses: actions/upload-artifact@v7
      if: always() && steps.authorize.outcome == 'success'
      with:
        name: qwen38-subagent-ablation-${{ inputs.phase }}-comparison-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/three-arm-comparison/
        if-no-files-found: error
        retention-days: 90
  format-probe:
    if: inputs.phase == 'smoke'
    needs:
    - validate
    - package-rust
    name: Real Qwen format probes (excluded from scoring)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install unchanged locked harness
      run: |-
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        path: ${{ runner.temp }}/packages/rust
    - name: Verify identity and run real Qwen through actual OpenCode/MCP
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/format-probe-index-seeds
      run: |-
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_e2e prepare --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/format-probe-evidence/protocol"
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_probe --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/format-probe-evidence"
    - name: Scan probe evidence for credential leakage
      id: secret-scan
      if: always() && steps.authorize.outcome == 'success'
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.ci.secret_scan --secret-env GLM_API_KEY --root
        "$RUNNER_TEMP/format-probe-evidence"
    - if: always() && steps.authorize.outcome == 'success' && steps.secret-scan.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: mcp-format-probe-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/format-probe-evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
  schema-reference:
    if: inputs.phase == 'schema-reference'
    needs:
    - validate
    name: Six Qwen generations / schema references
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: "set -euo pipefail\ntest \"$BENCH_REPOSITORY\" = Cuiyus/zvec-grep\nif [[ \"$BENCH_EVENT_NAME\" != \"workflow_dispatch\"\
        \ ]]; then\n  echo \"::error::SWE-QA Bench only accepts manual workflow_dispatch runs.\"\n  exit 1\nfi\nif\
        \ [[ -z \"$BENCH_ACTOR\" || -z \"$BENCH_TRIGGERING_ACTOR\" ]]; then\n  echo \"::error::Both the original actor\
        \ and the current triggering actor are required.\"\n  exit 1\nfi\nfor actor in \"$BENCH_ACTOR\" \"$BENCH_TRIGGERING_ACTOR\"\
        ; do\n  # The legacy permission field maps maintain to write; use role_name.\n  role=\"$(gh api \"repos/$BENCH_REPOSITORY/collaborators/$actor/permission\"\
        \ --jq '.role_name')\"\n  case \"$role\" in\n    admin|maintain)\n      echo \"Authorized $actor with repository\
        \ role $role.\"\n      ;;\n    *)\n      echo \"::error::SWE-QA Bench requires the admin or maintain repository\
        \ role; $actor has $role.\"\n      exit 1\n      ;;\n  esac\ndone\n"
    - name: Disallow automatic or manual reruns of the approved batch
      run: test "${{ github.run_attempt }}" = 1
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install unchanged locked harness
      run: 'python -m pip install --disable-pip-version-check uv==0.9.17

        uv sync --project benchmarks/swe-qa-bench --frozen'
    - uses: actions/download-artifact@v8
      with:
        name: three-arm-package-rust
        run-id: 40681992032
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/packages/rust
    - uses: actions/download-artifact@v8
      with:
        name: mcp-schema-audit
        run-id: 40681992032
        repository: Cuiyus/zvec-grep
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/native-schema
    - name: Verify frozen v6 package and run exactly six generation attempts
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/schema-probe-index-seeds
      run: 'uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_description_e2e prepare --packages "$RUNNER_TEMP/packages"
        --output "$RUNNER_TEMP/schema-reference-protocol"

        uv run --project benchmarks/swe-qa-bench python -m zg_bench.mcp_schema_reference_probe --packages "$RUNNER_TEMP/packages"
        --schema-audit "$RUNNER_TEMP/native-schema/schema-comparison.json" --output "$RUNNER_TEMP/schema-reference-evidence"'
    - name: Scan diagnostic evidence for credential leakage
      id: secret-scan
      if: always() && steps.authorize.outcome == 'success'
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.ci.secret_scan --secret-env GLM_API_KEY --root
        "$RUNNER_TEMP/schema-reference-evidence"
    - uses: actions/upload-artifact@v7
      if: always() && steps.authorize.outcome == 'success' && steps.secret-scan.outcome == 'success'
      with:
        name: mcp-schema-reference-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/schema-reference-evidence/

          ${{ runner.temp }}/schema-reference-protocol/'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
