name: Node Rust timeout attribution
run-name: Timeout attribution / Node 0.2.2 vs Rust f95fc49e / local / five pairs per case
'on':
  workflow_dispatch:
    inputs:
      task_scope:
        description: Historical timeout task for infrastructure recovery; empty runs all eight task/model cases
        required: false
        default: ''
        type: string
      model_scope:
        description: Model scope
        required: true
        default: all
        type: choice
        options:
        - all
        - glm-5.2
        - qwen3.8-max
permissions: {}
env:
  SWE_QA_MODEL_BASE_URL: ${{ vars.SWE_QA_MODEL_BASE_URL }}
concurrency:
  group: timeout-attribution-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate frozen evidence and tracing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        set -euo pipefail
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install frozen harness dependencies
      run: |
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - name: Validate frozen inputs and real loopback instrumentation
      run: |-
        uv run --project benchmarks/swe-qa-bench python - <<'PYCODE'
        import sys,unittest
        from zg_bench.native_baseline_e2e import validate_inputs
        validate_inputs()
        sys.path.insert(0,'benchmarks/swe-qa-bench/tests')
        # The dedicated 8-case workflow has its own matrix contract in test_wire_trace.
        names=['test_wire_trace','test_version_e2e.VersionComparisonTests','test_opencode','test_opencode_usage']
        suite=unittest.defaultTestLoader.loadTestsFromNames(names)
        assert unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful()
        PYCODE
    - name: Build the eight historical timeout task-model cases
      id: matrix
      env:
        TASK_SCOPE: ${{ inputs.task_scope }}
        MODEL_SCOPE: ${{ inputs.model_scope }}
      run: |-
        python - <<'PYCODE'
        import json,os
        cases=[{'task': 'conan-19', 'model': 'glm-5.2'}, {'task': 'matplotlib-37', 'model': 'glm-5.2'}, {'task': 'requests-16', 'model': 'glm-5.2'}, {'task': 'conan-19', 'model': 'qwen3.8-max'}, {'task': 'conan-39', 'model': 'qwen3.8-max'}, {'task': 'requests-16', 'model': 'qwen3.8-max'}, {'task': 'streamlink-14', 'model': 'qwen3.8-max'}, {'task': 'xarray-46', 'model': 'qwen3.8-max'}]
        if os.environ['TASK_SCOPE']: cases=[r for r in cases if r['task']==os.environ['TASK_SCOPE']]
        if os.environ['MODEL_SCOPE']!='all': cases=[r for r in cases if r['model']==os.environ['MODEL_SCOPE']]
        assert cases, 'Scope must match a historical timeout task/model'
        with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('matrix='+json.dumps({'include':cases},separators=(',',':')),file=f)
        PYCODE
  trace:
    name: Trace / ${{ matrix.task }} / ${{ matrix.model }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
    - name: Authorize manual benchmark run
      id: authorize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCH_REPOSITORY: ${{ github.repository }}
        BENCH_EVENT_NAME: ${{ github.event_name }}
        BENCH_ACTOR: ${{ github.actor }}
        BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        test "$BENCH_REPOSITORY" = Cuiyus/zvec-grep
        set -euo pipefail
        if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
          exit 1
        fi
        if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
          echo "::error::Both the original actor and the current triggering actor are required."
          exit 1
        fi
        for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
          # The legacy permission field maps maintain to write; use role_name.
          role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain)
              echo "Authorized $actor with repository role $role."
              ;;
            *)
              echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
              exit 1
              ;;
          esac
        done
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Reuse original frozen node package
      uses: actions/download-artifact@v8
      with:
        name: version-package-node
        run-id: 38413351617
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/packages/node
    - name: Reuse original frozen rust package
      uses: actions/download-artifact@v8
      with:
        name: version-package-rust
        run-id: 38413351617
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/packages/rust
    - name: Install frozen harness dependencies
      run: |
        python -m pip install --disable-pip-version-check uv==0.9.17
        uv sync --project benchmarks/swe-qa-bench --frozen
    - name: Run five traced Node/Rust pairs and unchanged blind judge
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        SWE_QA_MODEL: ${{ matrix.model }}
        BENCH_TASK: ${{ matrix.task }}
        BENCH_MODEL: ${{ matrix.model }}
        ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/trace-index-seeds
      run: |-
        uv run --project benchmarks/swe-qa-bench python -m zg_bench.version_e2e \
          --task "$BENCH_TASK" --model "$BENCH_MODEL" --embedding local \
          --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/trace-evidence" \
          --continue-after-failure --prebuild-task-image --wire-trace
    - name: Scan all raw trace evidence for configured credentials
      id: secret-scan
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: uv run --project benchmarks/swe-qa-bench python -m zg_bench.ci.secret_scan --secret-env GLM_API_KEY --root
        "$RUNNER_TEMP/trace-evidence"
      if: always() && steps.authorize.outcome == 'success'
    - name: Preserve every attempt, wire trace and process snapshot
      uses: actions/upload-artifact@v7
      if: always() && steps.authorize.outcome == 'success' && steps.secret-scan.outcome == 'success'
      with:
        name: timeout-trace-evidence-${{ matrix.model }}-${{ matrix.task }}
        path: ${{ runner.temp }}/trace-evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Preserve paired judged report
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: timeout-trace-report-${{ matrix.model }}-${{ matrix.task }}
        path: ${{ runner.temp }}/trace-evidence/report/report.json
        if-no-files-found: error
        retention-days: 90
