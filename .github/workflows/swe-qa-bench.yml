name: SWE-QA Bench

on:
  pull_request:
    branches:
      - "dev/**"
  push:
    branches:
      - "dev/**"

permissions: {}

env:
  # Set to all-full to run all 20 tasks on the next dev branch push.
  SWE_QA_SCOPE: smoke
  SWE_QA_MODELS: '["glm-5.2","qwen3.8-max"]'
  SWE_QA_TRIALS_PER_PROFILE: "3"

concurrency:
  group: swe-qa-bench-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate locked selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      task-matrix: ${{ steps.task-matrix.outputs.tasks }}
      model-matrix: ${{ steps.task-matrix.outputs.models }}
      task-count: ${{ steps.task-matrix.outputs.count }}
      task_ids_json: ${{ steps.task-matrix.outputs.task_ids_json }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Validate tasks, hashes, commits, and reference isolation
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa validate
          --selection benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json
          --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json
          --dataset benchmarks/swe-qa-bench/datasets
      - name: Build this run's task matrix from the locked selection
        id: task-matrix
        env:
          SCOPE: ${{ env.SWE_QA_SCOPE }}
          MODELS_JSON: ${{ env.SWE_QA_MODELS }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = json.loads(
              Path(
                  "benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json"
              ).read_text(encoding="utf-8")
          )
          tasks = selection["tasks"]
          tasks_by_id = {task["task_id"]: task for task in tasks}
          models = json.loads(os.environ["MODELS_JSON"])
          supported_models = {"glm-5.2", "qwen3.8-max"}
          if (
              not isinstance(models, list)
              or not models
              or any(not isinstance(model, str) or model not in supported_models for model in models)
              or len(models) != len(set(models))
          ):
              raise SystemExit("SWE_QA_MODELS must select unique supported model IDs")
          scope = os.environ["SCOPE"]
          if scope in {"smoke", "auto"}:
              task_ids = selection["gate"]["auto_tasks"]
          elif scope in {"all-full", "gate-20"}:
              # gate-20 remains accepted for legacy API/CLI dispatches.
              task_ids = [task["task_id"] for task in tasks]
          else:
              raise SystemExit(f"unsupported SWE-QA scope: {scope}")
          if not task_ids:
              raise SystemExit(f"SWE-QA scope {scope} selected no tasks")
          if len(task_ids) != len(set(task_ids)):
              raise SystemExit(f"SWE-QA scope {scope} selected duplicate tasks")
          missing = sorted(set(task_ids) - tasks_by_id.keys())
          if missing:
              raise SystemExit(
                  f"SWE-QA scope {scope} selected unknown tasks: {missing}"
              )
          selected = [tasks_by_id[task_id] for task_id in task_ids]
          slugs = [task["task_slug"] for task in selected]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"tasks={json.dumps(slugs, separators=(',', ':'))}\n")
              output.write(f"models={json.dumps(models, separators=(',', ':'))}\n")
              output.write(f"count={len(slugs)}\n")
              output.write(
                  f"task_ids_json={json.dumps(task_ids, separators=(',', ':'))}\n"
              )
          PY
      - name: Run benchmark unit tests
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m unittest discover
          -s benchmarks/swe-qa-bench/tests -v
      - name: Verify both models' Harbor commands without credentials
        run: |
          set -euo pipefail
          mapfile -t models < <(
            python -c 'import json, os; print(*json.loads(os.environ["SWE_QA_MODELS"]), sep="\n")'
          )
          for model_id in "${models[@]}"; do
            uv run --project benchmarks/swe-qa-bench zg-bench run \
              swe-qa-bench \
              --tier smoke \
              --agent opencode \
              --model "custom-openai/$model_id" \
              --profile all \
              --n-attempts "$SWE_QA_TRIALS_PER_PROFILE" \
              --embedding-model local/potion-code-16m-v2 \
              --zvec-grep-package "$GITHUB_WORKSPACE" \
              --job-name "preflight-$model_id" \
              --dry-run
          done

  run-pair:
    name: Pair + judge / ${{ matrix.model }} / ${{ matrix.task }}
    needs: validate
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        task: ${{ fromJSON(needs.validate.outputs.task-matrix) }}
        model: ${{ fromJSON(needs.validate.outputs.model-matrix) }}
    env:
      MODEL_ID: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Restore this task's zvec index seed
        id: zvec-index-seed-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/swe-qa-index-seed
          key: swe-qa-zvec-index-seed-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.model }}-${{ matrix.task }}-bench-${{ hashFiles('benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json', 'benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json', format('benchmarks/swe-qa-bench/datasets/{0}/environment/Dockerfile', matrix.task)) }}-npm-${{ hashFiles('package-lock.json') }}-zvec-${{ hashFiles('src/**', 'package.json', 'tsconfig.json', 'eslint.config.js', 'README.md', 'README_CN.md', 'LICENSE', 'docs/**', '.opencode/opencode.json', 'benchmarks/swe-qa-bench/pyproject.toml', 'benchmarks/swe-qa-bench/uv.lock', 'benchmarks/swe-qa-bench/suites/swe-qa-bench.yaml', 'benchmarks/swe-qa-bench/zg_bench/agents/zvec_grep.py', 'benchmarks/swe-qa-bench/zg_bench/runner.py', 'benchmarks/swe-qa-bench/zg_bench/settings.py') }}
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
          npm ci
      - name: Run baseline and zvec-grep on the same runner
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
          ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/swe-qa-index-seed
        run: |
          set -euo pipefail
          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY Actions secret is not configured" >&2
            exit 2
          fi
          runs_dir="$RUNNER_TEMP/swe-qa-runs/$MODEL_ID/$TASK_NAME"
          uv run --project benchmarks/swe-qa-bench zg-bench run \
            swe-qa-bench \
            --tier full \
            --task "$TASK_NAME" \
            --agent opencode \
            --model "custom-openai/$MODEL_ID" \
            --profile all \
            --n-attempts "$SWE_QA_TRIALS_PER_PROFILE" \
            --embedding-model local/potion-code-16m-v2 \
            --zvec-grep-package "$GITHUB_WORKSPACE" \
            --jobs-dir "$runs_dir" \
            --job-name "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MODEL_ID}-${TASK_NAME}"
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa collect \
            --runs-dir "$runs_dir" \
            --task "$TASK_NAME" \
            --expected-trials "$SWE_QA_TRIALS_PER_PROFILE" \
            --output "$RUNNER_TEMP/pair-${MODEL_ID}-${TASK_NAME}.json"
      - name: Judge this pair and write its independent report
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          set -euo pipefail
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa judge \
            --pairs-root "$RUNNER_TEMP/pair-${MODEL_ID}-${TASK_NAME}.json" \
            --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json \
            --output-dir "$RUNNER_TEMP/swe-qa-task-report/${MODEL_ID}/${TASK_NAME}" \
            --expected "$TASK_NAME" \
            --agent-model "custom-openai/$MODEL_ID"
      - name: Reject secret leakage in artifacts
        id: secret-scan
        if: always()
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
          ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/swe-qa-index-seed
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def contains_secret(path: Path, secret: bytes) -> bool:
              overlap = max(len(secret) - 1, 0)
              tail = b""
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      window = tail + chunk
                      if secret in window:
                          return True
                      tail = window[-overlap:] if overlap else b""
              return False

          secret = os.environ.get("GLM_API_KEY", "").encode()
          roots = [
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-runs" / os.environ["MODEL_ID"] / os.environ["TASK_NAME"],
              Path(os.environ["RUNNER_TEMP"]) / f"pair-{os.environ['MODEL_ID']}-{os.environ['TASK_NAME']}.json",
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-task-report" / os.environ["MODEL_ID"] / os.environ["TASK_NAME"],
              Path(os.environ["ZG_BENCH_INDEX_SEED_DIR"]),
          ]
          if secret:
              for root in roots:
                  files = [root] if root.is_file() else root.rglob("*") if root.exists() else []
                  for path in files:
                      if path.is_file() and contains_secret(path, secret):
                          raise SystemExit(f"secret material detected in artifact: {path}")
          PY
      - name: Upload paired Harbor evidence
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-pair-${{ matrix.model }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pair-${{ matrix.model }}-${{ matrix.task }}.json
            ${{ runner.temp }}/swe-qa-runs/${{ matrix.model }}/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload independent task report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-task-report-${{ matrix.model }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-task-report/${{ matrix.model }}/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Save this task's populated zvec index seed
        if: success() && steps.zvec-index-seed-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/swe-qa-index-seed
          key: ${{ steps.zvec-index-seed-restore.outputs.cache-primary-key }}

  aggregate-report:
    name: Aggregate / ${{ matrix.model }}
    needs: [validate, run-pair]
    if: >-
      always() && !cancelled() &&
      needs.validate.result == 'success' &&
      needs.run-pair.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.validate.outputs.model-matrix) }}
    env:
      MODEL_ID: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked report environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Download this attempt's independent task reports
        uses: actions/download-artifact@v8
        with:
          pattern: swe-qa-task-report-${{ matrix.model }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-reports
      - name: Detect report scope and show partial task reports
        id: report-set
        env:
          EXPECTED_COUNT: ${{ needs.validate.outputs.task-count }}
        run: |
          set -euo pipefail
          expected_count="$EXPECTED_COUNT"
          if [[ ! "$expected_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid expected report count: $expected_count"
            exit 1
          fi

          report_root="$RUNNER_TEMP/task-reports"
          mkdir -p "$report_root"
          mapfile -d '' -t json_reports < <(
            find "$report_root" -type f -name report.json -print0 | LC_ALL=C sort -z
          )
          actual_count="${#json_reports[@]}"
          if (( actual_count == 0 )); then
            if (( GITHUB_RUN_ATTEMPT > 1 )); then
              echo "complete=false" >> "$GITHUB_OUTPUT"
              {
                echo "## SWE-QA Aggregate / $MODEL_ID"
                echo
                echo "Attempt ${GITHUB_RUN_ATTEMPT} produced no new task reports for this model. No Aggregate was generated, and reports from earlier attempts were not used."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::No independent task reports were downloaded for this attempt."
            exit 1
          fi

          if [[ "$actual_count" == "$expected_count" ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' -t markdown_reports < <(
            find "$report_root" -type f -name report.md -print0 | LC_ALL=C sort -z
          )
          if (( ${#markdown_reports[@]} != actual_count )); then
            echo "::error::Expected one report.md for each downloaded report.json."
            exit 1
          fi

          echo "complete=false" >> "$GITHUB_OUTPUT"
          {
            echo "## SWE-QA Aggregate / $MODEL_ID"
            echo
            echo "**Partial attempt:** attempt ${GITHUB_RUN_ATTEMPT} contains ${actual_count} of ${expected_count} task reports. The cross-task Aggregate was intentionally skipped to avoid mixing workflow attempts, and no partial Aggregate artifact was generated."
            echo
            echo "The independent task report(s) produced by this attempt are shown below. Any Aggregate row inside an embedded report covers that task only."

            shown=0
            for report in "${markdown_reports[@]}"; do
              if (( shown > 0 )); then
                echo
                echo "---"
              fi
              shown=$((shown + 1))
              echo
              sed '1s/^# /### /' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Combine reports without re-judging
        if: steps.report-set.outputs.complete == 'true'
        env:
          EXPECTED_TASKS_JSON: ${{ needs.validate.outputs.task_ids_json }}
        run: |
          set -euo pipefail
          mapfile -t expected_tasks < <(
            python -c 'import json, os; print(*json.loads(os.environ["EXPECTED_TASKS_JSON"]), sep="\n")'
          )
          if (( ${#expected_tasks[@]} == 0 )); then
            echo "::error::Locked selection produced no expected task IDs."
            exit 1
          fi
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa aggregate \
            --reports-root "$RUNNER_TEMP/task-reports" \
            --output-dir "$RUNNER_TEMP/swe-qa-aggregate-report" \
            --expected "${expected_tasks[@]}"
      - name: Upload aggregate report
        if: steps.report-set.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-aggregate-report-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-aggregate-report/
          if-no-files-found: warn
          retention-days: 90
