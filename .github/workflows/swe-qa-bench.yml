name: SWE-QA Bench
run-name: PR179 E2E / GLM-5.2 + Qwen3.8-Max / local + remote / 480 trials
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Optional prior run containing completed first-task trials to collect and judge without rerunning agents
        required: false
        default: ''
        type: string
permissions: {}
env:
  SWE_QA_MODEL_BASE_URL: ${{ vars.SWE_QA_MODEL_BASE_URL }}
concurrency:
  group: pr179-e2e-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate frozen experiment and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      canary: ${{ steps.matrix.outputs.canary }}
      remaining: ${{ steps.matrix.outputs.remaining }}
    steps:
      - &authorize-benchmark
        name: Authorize manual benchmark run
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_REPOSITORY: ${{ github.repository }}
          BENCH_EVENT_NAME: ${{ github.event_name }}
          BENCH_ACTOR: ${{ github.actor }}
          BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$BENCH_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::SWE-QA Bench only accepts manual workflow_dispatch runs."
            exit 1
          fi
          if [[ -z "$BENCH_ACTOR" || -z "$BENCH_TRIGGERING_ACTOR" ]]; then
            echo "::error::Both the original actor and the current triggering actor are required."
            exit 1
          fi
          for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
            # The legacy permission field maps maintain to write; use role_name.
            role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
            case "$role" in
              admin|maintain)
                echo "Authorized $actor with repository role $role."
                ;;
              *)
                echo "::error::SWE-QA Bench requires the admin or maintain repository role; $actor has $role."
                exit 1
                ;;
            esac
          done
      - name: Require the development fork
        run: test "$GITHUB_REPOSITORY" = Cuiyus/zvec-grep
      - name: Validate recovery run identity
        env:
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
        run: test -z "$EVIDENCE_RUN" || [[ "$EVIDENCE_RUN" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen harness dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Validate locked tasks and reference isolation
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa validate
          --selection benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json
          --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json
          --dataset benchmarks/swe-qa-bench/datasets
      - name: Run agent, scoring, accounting, and PR comparison tests
        run: |
          # Two existing workflow test modules target the original no-zg/zg
          # workflow; test_pr179_e2e covers this adoption workflow instead.
          uv run --project benchmarks/swe-qa-bench python - <<'PYCODE'
          import sys, unittest
          from pathlib import Path
          tests=Path('benchmarks/swe-qa-bench/tests')
          sys.path.insert(0,str(tests))
          modules=[p.stem for p in tests.glob('test_*.py') if p.stem not in ('test_ci_workflow','test_swe_qa_workflow')]
          suite=unittest.TestLoader().loadTestsFromNames(sorted(modules))
          sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PYCODE
      - name: Build the four-configuration frozen task matrix
        id: matrix
        run: |
          python - <<'PYCODE'
          import itertools, json, os
          from pathlib import Path
          selection=json.loads(Path('benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json').read_text())
          tasks=[t['task_slug'] for t in selection['tasks']]
          assert len(tasks)==len(set(tasks))==20 and tasks[0]=='reflex-6'
          rows=[dict(task=t,model=m,embedding=e) for t,m,e in itertools.product(tasks,['glm-5.2','qwen3.8-max'],['local','remote'])]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,items in [('canary',rows[:4]),('remaining',rows[4:])]:
                  print(key+'='+json.dumps({'include':items},separators=(',',':')),file=f)
          PYCODE
      - name: Validate remote configuration presence
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: test -n "$GLM_API_KEY" && test -n "$ZVEC_GREP_API_KEY" && test -n "$ZVEC_GREP_ENDPOINT"

  canary:
    name: First task / ${{ matrix.model }} / ${{ matrix.embedding }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.canary) }}
    steps: &trial-steps
      - *authorize-benchmark
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download verified before-PR package
        uses: actions/download-artifact@v8
        with:
          name: package-retrieval-candidate
          run-id: 37903765050
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packages/before
      - name: Download verified after-PR package
        uses: actions/download-artifact@v8
        with:
          name: package-retrieval-candidate
          run-id: 37903768937
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packages/after
      - name: Install frozen harness dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Recover completed first-task evidence without new agent calls
        if: inputs.evidence_run != '' && matrix.task == 'reflex-6'
        uses: actions/download-artifact@v8
        with:
          name: pr179-evidence-${{ matrix.model }}-${{ matrix.embedding }}-${{ matrix.task }}
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr179-evidence
      - name: Run three before-after repetitions, both with zg, and blind judge
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ matrix.embedding == 'remote' && secrets.QWEN_EMBEDDING_API_KEY || '' }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
          SWE_QA_MODEL: ${{ matrix.model }}
          BENCH_TASK: ${{ matrix.task }}
          BENCH_MODEL: ${{ matrix.model }}
          BENCH_EMBEDDING: ${{ matrix.embedding }}
          ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/pr179-index-seeds
          PR179_EVIDENCE_RUN: ${{ inputs.evidence_run }}
        run: |
          recovery_args=()
          if [[ -n "$PR179_EVIDENCE_RUN" && "$BENCH_TASK" == reflex-6 ]]; then
            recovery_args+=(--collect-only)
          fi
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.pr179_e2e \
            --task "$BENCH_TASK" --model "$BENCH_MODEL" --embedding "$BENCH_EMBEDDING" \
            --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/pr179-evidence" "${recovery_args[@]}"
      - name: Scan all evidence for credential leakage
        id: secret-scan
        if: always() && steps.authorize.outcome == 'success'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.ci.secret_scan
          --secret-env GLM_API_KEY --secret-env ZVEC_GREP_API_KEY
          --root "$RUNNER_TEMP/pr179-evidence"
      - name: Preserve full evidence including failed retry history
        if: always() && steps.authorize.outcome == 'success' && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pr179-evidence-${{ matrix.model }}-${{ matrix.embedding }}-${{ matrix.task }}
          path: ${{ runner.temp }}/pr179-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compact judged report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pr179-report-${{ matrix.model }}-${{ matrix.embedding }}-${{ matrix.task }}
          path: ${{ runner.temp }}/pr179-evidence/report/report.json
          if-no-files-found: error
          retention-days: 90

  remaining:
    name: Pair / ${{ matrix.task }} / ${{ matrix.model }} / ${{ matrix.embedding }}
    needs: [validate, canary]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.validate.outputs.remaining) }}
    steps: *trial-steps
