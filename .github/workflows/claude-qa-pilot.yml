name: Claude Qwen QA pilot
on:
  push:
    branches: [dev/claude-zvec-qa-pilot]
    paths: ['benchmarks/claude-qa-pilot/**', 'benchmarks/zvec-issue-qa/**', '.github/workflows/claude-qa-pilot.yml']
  workflow_dispatch:
    inputs:
      task:
        description: Frozen task selection
        type: choice
        options: [both, reflex-6, zvec-q001]
        default: both
      workspace_root_guidance:
        description: Root V2 shared /workspace guidance (reflex-6 only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  provider-probe:
    if: github.repository == 'Cuiyus/zvec-grep' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.selection.outputs.tasks }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve frozen task selection before provider calls
        id: selection
        env:
          PILOT_TASK: ${{ inputs.task || 'both' }}
          PILOT_ROOT_GUIDANCE: ${{ inputs.workspace_root_guidance && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os
          task = os.environ['PILOT_TASK']
          if os.environ['PILOT_ROOT_GUIDANCE'] == 'true' and task != 'reflex-6':
              raise SystemExit('root-v2 is frozen to task=reflex-6 only')
          tasks = ['reflex-6', 'zvec-q001'] if task == 'both' else [task]
          if any(value not in ('reflex-6', 'zvec-q001') for value in tasks):
              raise SystemExit('unknown frozen task')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tasks=' + json.dumps(tasks) + '\n')
          PY
      - name: Verify Qwen Anthropic protocol and exact model
        env:
          ANTHROPIC_BASE_URL: https://llm-67x4s810wr6kl2i4.cn-beijing.maas.aliyuncs.com/apps/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GLM_API_KEY }}
          ANTHROPIC_MODEL: qwen3.8-max
        run: python3 benchmarks/claude-qa-pilot/probe_provider.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-probe
          path: provider-probe.json
  paired-pilot:
    needs: provider-probe
    if: github.repository == 'Cuiyus/zvec-grep' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.provider-probe.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test pilot parser and isolation contracts
        run: python3 -m unittest discover -s benchmarks/claude-qa-pilot -p 'test_*.py' -v
      - name: Read the existing main Rust binary artifact
        uses: actions/download-artifact@v8
        with:
          repository: zvec-ai/zvec-grep
          run-id: 39221698769
          name: rust-native-linux-x64-gnu
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-native
      - name: Verify exact main Rust package and stage build context
        run: >-
          python3 benchmarks/claude-qa-pilot/prepare_rust_runtime.py
          --artifact-dir '${{ runner.temp }}/rust-native'
          --runtime-dir benchmarks/claude-qa-pilot/runtime
      - name: Build pinned Claude and zg runtime
        run: docker build -f benchmarks/claude-qa-pilot/Dockerfile -t zg-claude-qa-pilot:20261019 benchmarks/claude-qa-pilot
      - name: Verify local retrieval with immutable offline model cache
        run: >-
          docker run --rm --user 1001:1001 --network none --read-only --tmpfs /tmp:rw,exec,size=1g
          zg-claude-qa-pilot:20261019 sh /opt/qa/smoke_local.sh
      - name: Verify native tools, MCP and request settings offline
        run: |
          mkdir -p '${{ runner.temp }}/reports-${{ matrix.task }}'
          docker run --rm --network none \
            -v "$PWD/benchmarks/claude-qa-pilot:/pilot:ro" \
            -v '${{ runner.temp }}/reports-${{ matrix.task }}:/out' \
            zg-claude-qa-pilot:20261019 \
            python3 /pilot/probe_cli.py --output /out/cli-probe.json
      - name: Run one frozen pair
        env:
          ANTHROPIC_BASE_URL: https://llm-67x4s810wr6kl2i4.cn-beijing.maas.aliyuncs.com/apps/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          python3 benchmarks/claude-qa-pilot/ci_run.py
          --task '${{ matrix.task }}'
          --work '${{ runner.temp }}/pilot-${{ matrix.task }}'
          --reports '${{ runner.temp }}/reports-${{ matrix.task }}'
          --repeats 1
          ${{ inputs.workspace_root_guidance && '--workspace-root-guidance' || '' }}
      - name: Preserve complete or partial evidence and redact credentials
        id: collect
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          python3 benchmarks/claude-qa-pilot/ci_run.py --collect-only
          --work '${{ runner.temp }}/pilot-${{ matrix.task }}'
          --reports '${{ runner.temp }}/reports-${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: qa-${{ matrix.task }}
          path: ${{ runner.temp }}/reports-${{ matrix.task }}
