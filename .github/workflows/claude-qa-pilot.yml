name: Claude Qwen QA pilot
on:
  push:
    branches: [dev/claude-zvec-qa-pilot]
    paths: ['benchmarks/claude-qa-pilot/**', 'benchmarks/zvec-issue-qa/**', '.github/workflows/claude-qa-pilot.yml']
  workflow_dispatch:
    inputs:
      task:
        description: Frozen task selection
        type: choice
        options: [both, reflex-6, zvec-q001, zvec-expansion, zvec-q004]
        default: both
      workspace_root_guidance:
        description: Root V2 shared /workspace guidance (reflex-6 only)
        type: boolean
        default: false
      completion_budget:
        description: Completion V2 shared 24-call budget (zvec-q001 or separately frozen issue phases)
        type: boolean
        default: false
      completion_confirmation:
        description: Two further frozen completion V2 pairs (zvec-q001 with completion budget only)
        type: boolean
        default: false
      closed_issue_expansion:
        description: Separately frozen q002 and q003 batch (completion budget required)
        type: boolean
        default: false
      remote_embedding_pilot:
        description: Separately frozen remote Qwen embedding single q001 pair (completion budget required)
        type: boolean
        default: false
      architecture_pilot:
        description: Separately frozen remote-embedding architecture q004 single pair (completion budget required)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  provider-probe:
    if: github.repository == 'Cuiyus/zvec-grep' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.selection.outputs.tasks }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve frozen task selection before provider calls
        id: selection
        env:
          PILOT_TASK: ${{ inputs.task || 'both' }}
          PILOT_ROOT_GUIDANCE: ${{ inputs.workspace_root_guidance && 'true' || 'false' }}
          PILOT_COMPLETION_BUDGET: ${{ inputs.completion_budget && 'true' || 'false' }}
          PILOT_COMPLETION_CONFIRMATION: ${{ inputs.completion_confirmation && 'true' || 'false' }}
          PILOT_ISSUE_EXPANSION: ${{ inputs.closed_issue_expansion && 'true' || 'false' }}
          PILOT_REMOTE_EMBEDDING: ${{ inputs.remote_embedding_pilot && 'true' || 'false' }}
          PILOT_ARCHITECTURE: ${{ inputs.architecture_pilot && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os
          task = os.environ['PILOT_TASK']
          if task not in ('both', 'reflex-6', 'zvec-q001', 'zvec-expansion', 'zvec-q004'):
              raise SystemExit('unknown frozen task selection')
          expansion = os.environ['PILOT_ISSUE_EXPANSION'] == 'true'
          remote = os.environ.get('PILOT_REMOTE_EMBEDDING', 'false') == 'true'
          architecture = os.environ.get('PILOT_ARCHITECTURE', 'false') == 'true'
          if architecture and (task != 'zvec-q004' or os.environ['PILOT_COMPLETION_BUDGET'] != 'true' or os.environ['PILOT_ROOT_GUIDANCE'] == 'true' or os.environ['PILOT_COMPLETION_CONFIRMATION'] == 'true' or expansion or remote):
              raise SystemExit('architecture phase requires one q004 completion-budget pair with no other phase')
          if task == 'zvec-q004' and not architecture:
              raise SystemExit('q004 requires its separate architecture phase flag')
          if remote and (task != 'zvec-q001' or os.environ['PILOT_COMPLETION_BUDGET'] != 'true' or os.environ['PILOT_ROOT_GUIDANCE'] == 'true' or os.environ['PILOT_COMPLETION_CONFIRMATION'] == 'true' or expansion):
              raise SystemExit('remote embedding requires one q001 completion-budget pair with no other phase')
          if expansion and (task != 'zvec-expansion' or os.environ['PILOT_COMPLETION_BUDGET'] != 'true' or os.environ['PILOT_ROOT_GUIDANCE'] == 'true' or os.environ['PILOT_COMPLETION_CONFIRMATION'] == 'true'):
              raise SystemExit('issue expansion requires its full task batch, completion budget, and no other phase')
          if task == 'zvec-expansion' and not expansion:
              raise SystemExit('zvec-expansion requires its separate phase flag')
          if os.environ['PILOT_ROOT_GUIDANCE'] == 'true' and task != 'reflex-6':
              raise SystemExit('root-v2 is frozen to task=reflex-6 only')
          if os.environ['PILOT_COMPLETION_BUDGET'] == 'true' and ((task != 'zvec-q001' and not expansion and not architecture) or os.environ['PILOT_ROOT_GUIDANCE'] == 'true'):
              raise SystemExit('completion-v2 requires zvec-q001 or a separate issue expansion/architecture phase')
          if os.environ['PILOT_COMPLETION_CONFIRMATION'] == 'true' and (task != 'zvec-q001' or os.environ['PILOT_COMPLETION_BUDGET'] != 'true' or os.environ['PILOT_ROOT_GUIDANCE'] == 'true'):
              raise SystemExit('completion confirmation requires task=zvec-q001, completion_budget=true and workspace_root_guidance=false')
          tasks = (['zvec-q002', 'zvec-q003'] if expansion else
                   ['reflex-6', 'zvec-q001'] if task == 'both' else [task])
          if any(value not in ('reflex-6', 'zvec-q001', 'zvec-q002', 'zvec-q003', 'zvec-q004') for value in tasks):
              raise SystemExit('unknown frozen task')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tasks=' + json.dumps(tasks) + '\n')
          PY
      - name: Verify issue expansion is frozen before provider calls
        if: inputs.closed_issue_expansion
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'benchmarks/claude-qa-pilot')
          from ci_run import validate_expansion_plan
          validate_expansion_plan()
          PY
      - name: Verify remote embedding plan and environment before provider calls
        if: inputs.remote_embedding_pilot
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'benchmarks/claude-qa-pilot')
          from ci_run import validate_remote_embedding_plan
          from remote_embedding import validate_environment
          validate_remote_embedding_plan()
          validate_environment()
          PY
      - name: Verify architecture plan and environment before provider calls
        if: inputs.architecture_pilot
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'benchmarks/claude-qa-pilot')
          from ci_run import validate_architecture_plan
          from remote_embedding import validate_environment
          validate_architecture_plan()
          validate_environment()
          PY
      - name: Verify Qwen Anthropic protocol and exact model
        env:
          ANTHROPIC_BASE_URL: https://llm-67x4s810wr6kl2i4.cn-beijing.maas.aliyuncs.com/apps/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GLM_API_KEY }}
          ANTHROPIC_MODEL: qwen3.8-max
        run: python3 benchmarks/claude-qa-pilot/probe_provider.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-probe
          path: provider-probe.json
  paired-pilot:
    needs: provider-probe
    if: github.repository == 'Cuiyus/zvec-grep' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.completion_confirmation && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.provider-probe.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test pilot parser and isolation contracts
        run: |
          python3 -m unittest discover -s benchmarks/claude-qa-pilot -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/zvec-issue-qa -p 'test_*.py' -v
      - name: Read the existing main Rust binary artifact
        uses: actions/download-artifact@v8
        with:
          repository: zvec-ai/zvec-grep
          run-id: 39221698769
          name: rust-native-linux-x64-gnu
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-native
      - name: Verify exact main Rust package and stage build context
        run: >-
          python3 benchmarks/claude-qa-pilot/prepare_rust_runtime.py
          --artifact-dir '${{ runner.temp }}/rust-native'
          --runtime-dir benchmarks/claude-qa-pilot/runtime
      - name: Build pinned Claude and zg runtime
        run: docker build -f benchmarks/claude-qa-pilot/Dockerfile -t zg-claude-qa-pilot:20261019 benchmarks/claude-qa-pilot
      - name: Verify local retrieval with immutable offline model cache
        run: >-
          docker run --rm --user 1001:1001 --network none --read-only --tmpfs /tmp:rw,exec,size=1g
          zg-claude-qa-pilot:20261019 sh /opt/qa/smoke_local.sh
      - name: Verify native tools, MCP and request settings offline
        run: |
          mkdir -p '${{ runner.temp }}/reports-${{ matrix.task }}'
          docker run --rm --network none \
            -v "$PWD/benchmarks/claude-qa-pilot:/pilot:ro" \
            -v '${{ runner.temp }}/reports-${{ matrix.task }}:/out' \
            zg-claude-qa-pilot:20261019 \
            python3 /pilot/probe_cli.py --output /out/cli-probe.json
      - name: Verify completion budget hook and final answer offline
        if: inputs.completion_budget
        run: |
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,size=2g --tmpfs /run:rw,size=64m \
            -v "$PWD/benchmarks/claude-qa-pilot:/pilot:ro" \
            -v '${{ runner.temp }}/reports-${{ matrix.task }}:/out' \
            zg-claude-qa-pilot:20261019 \
            python3 /pilot/probe_budget.py --output /out/budget-probe.json
      - name: Run frozen paired trials
        env:
          ANTHROPIC_BASE_URL: https://llm-67x4s810wr6kl2i4.cn-beijing.maas.aliyuncs.com/apps/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ (inputs.remote_embedding_pilot || inputs.architecture_pilot) && secrets.QWEN_EMBEDDING_API_KEY || '' }}
          ZVEC_GREP_ENDPOINT: ${{ (inputs.remote_embedding_pilot || inputs.architecture_pilot) && vars.QWEN_EMBEDDING_ENDPOINT || '' }}
        run: >-
          python3 benchmarks/claude-qa-pilot/ci_run.py
          --task '${{ matrix.task }}'
          --work '${{ runner.temp }}/pilot-${{ matrix.task }}'
          --reports '${{ runner.temp }}/reports-${{ matrix.task }}'
          --repeats ${{ inputs.completion_confirmation && 2 || 1 }}
          ${{ inputs.workspace_root_guidance && '--workspace-root-guidance' || '' }}
          ${{ inputs.completion_budget && '--completion-budget' || '' }}
          ${{ inputs.completion_confirmation && '--completion-confirmation' || '' }}
          ${{ inputs.closed_issue_expansion && '--closed-issue-expansion' || '' }}
          ${{ inputs.remote_embedding_pilot && '--remote-embedding-pilot' || '' }}
          ${{ inputs.architecture_pilot && '--architecture-pilot' || '' }}
      - name: Preserve complete or partial evidence and redact credentials
        id: collect
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ (inputs.remote_embedding_pilot || inputs.architecture_pilot) && secrets.QWEN_EMBEDDING_API_KEY || '' }}
        run: >-
          python3 benchmarks/claude-qa-pilot/ci_run.py --collect-only
          --work '${{ runner.temp }}/pilot-${{ matrix.task }}'
          --reports '${{ runner.temp }}/reports-${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: qa-${{ matrix.task }}
          path: ${{ runner.temp }}/reports-${{ matrix.task }}
