name: Rust CI
run-name: Verify optimize regression against pre-fix Rust
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: rust
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
jobs:
  regression:
    name: Regression must fail on pre-fix source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require the development fork
        run: test "$GITHUB_REPOSITORY" = Cuiyus/zvec-grep
      - name: Restore pre-fix production source, retaining the candidate integration assertion
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --depth=1 origin 3f978861959abefd2f5b7308994b038e0ce3e229
          git restore --source 3f978861959abefd2f5b7308994b038e0ce3e229 -- rust/crates/zg-engine/src
          git diff --stat
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Require the exact native index-completeness regression
        shell: bash
        run: |
          set +e
          cargo test --locked --package zg-engine --test engine_storage \
            one_text_model_indexes_text_and_skips_images_without_embedding_them -- --exact \
            > "$RUNNER_TEMP/optimize-regression.log" 2>&1
          regression_status=$?
          set -e
          cat "$RUNNER_TEMP/optimize-regression.log"
          test "$regression_status" -ne 0
          grep -F 'default indexing must finish the vector index' "$RUNNER_TEMP/optimize-regression.log"
          grep -F 'completeness: 0.0' "$RUNNER_TEMP/optimize-regression.log"
      - name: Preserve the original failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pre-fix-optimize-regression
          path: ${{ runner.temp }}/optimize-regression.log
          if-no-files-found: error
          retention-days: 30
