name: Task 328 · Markdown conversion + one Qwen3.8-Max pair
run-name: "Task 328 · Office→Markdown audit → baseline 1 + zg 1 · ${{ github.ref_name }}"

on:
  push:
    branches: [dev/benchmark-qoder-qwen38-qa]
    paths:
      - '.github/workflows/workspace-qa-markdown-smoke.yml'
      - '.github/actions/workspace-qa/**'
      - 'benchmarks/workspace-qa/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-qa-task328-markdown-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[workspace-qa-markdown-smoke]')
    name: "328 · conversion gate → baseline 1 + with-zg 1 → judge"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate harness and freeze exactly one Task 328 pair
        run: |
          python -m unittest discover -s benchmarks/workspace-qa/tests -v
          cp benchmarks/workspace-qa/data/task-328-markdown-smoke-lock.json benchmarks/workspace-qa/data/lock.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('benchmarks/workspace-qa/data/lock.json').read_text())
          assert [t['task_id'] for t in lock['tasks']] == ['328']
          assert lock['repetitions'] == 1
          assert lock['experiment']['preprocessing'] == 'office-markdown-v1'
          assert lock['experiment']['requested_model'] == 'qwen3.8-max'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Task 328 only; baseline **1** + with-zg **1**. '
                        'Uniform full-persona DOCX/PPTX/XLSX sidecars, retained originals and TXT, '
                        'conversion gate before any QA trial. Original question/rubrics. '
                        'Custom GLM judge; descriptive smoke, not a leaderboard score.\n')
          PY
      - uses: ./.github/actions/workspace-qa
        with:
          task-id: '328'
          repetitions: '1'
          phase: smoke
          artifact-prefix: workspace-qa-task328-markdown-v1
          qoder-token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          judge-key: ${{ secrets.GLM_API_KEY }}
          embedding-key: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
