name: Workspace Lite CN · official Task 363 extended smoke
run-name: "Task 363 · Qoder 1.1.45 · Qwen3.8-Max high · zg 0.2.2 · ${{ github.ref_name }}"

on:
  push:
    branches: [dev/benchmark-qoder-qwen38-qa]
    paths:
      - '.github/workflows/workspace-qa-363-long.yml'
      - '.github/actions/workspace-qa/**'
      - 'benchmarks/workspace-qa/**'
      - 'benchmarks/swe-qa-bench/zg_bench/swe_qa/readonly_agents.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-qa-363-long-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[workspace-qa-363-long]')
    name: Task 363 · baseline 1 + zg 1 · judge
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PDF extraction and audit engines
        run: python -m pip install -r benchmarks/workspace-qa/pdf-requirements.txt
      - name: Validate frozen original task and symmetric limits
        run: |
          python -m unittest discover -s benchmarks/workspace-qa/tests -q
          cp benchmarks/workspace-qa/data/official-tasks-334-363-one-pair-lock.json benchmarks/workspace-qa/data/lock.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'benchmarks/workspace-qa')
          from run_task import task_qa_limits
          lock = json.loads(Path('benchmarks/workspace-qa/data/lock.json').read_text())
          task = next(t for t in lock['tasks'] if t['task_id'] == '363')
          experiment = lock['experiment']
          assert lock['repetitions'] == 1 and experiment['protocol'] == 'workspace-qa-qoder-native-install-v3'
          assert experiment['agent'] == 'qodercli' and experiment['qoder_version'] == '1.1.45'
          assert experiment['requested_model'] == 'qwen3.8-max' and experiment['reasoning_effort'] == 'high'
          assert experiment['zg_version'] == '0.2.2'
          assert experiment['integration']['command'] == ['zg', 'install', '--target', 'qoder', '--yes']
          assert experiment['embedding']['model'] == 'qwen/qwen3.7-text-embedding'
          assert experiment['execution_mode'] == 'official-writable'
          assert task_qa_limits(lock, task) == {
              'input_tokens': 12000000, 'wall_seconds': 3600,
              'model_requests': 180, 'tool_calls': 360}
          PY
      - uses: ./.github/actions/workspace-qa
        with:
          task-id: '363'
          repetitions: '1'
          phase: smoke
          artifact-prefix: workspace-lite-cn-official-363-long
          qoder-token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          judge-key: ${{ secrets.GLM_API_KEY }}
          embedding-key: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
