name: Native zg install E2E prompt stability

on:
  push:
    branches: [dev/benchmark-readonly-qa]
    paths:
      - "benchmarks/swe-qa-bench/**"
      - ".github/workflows/native-qa-stability.yml"
  workflow_dispatch:
    inputs:
      run_retrieval_only:
        description: Run post-E2E Ground Truth generation and five retrieval replays per observed request
        required: false
        type: boolean
        default: false
      run_prompt_test:
        description: Test MCP description and guidance variants before E2E; otherwise use the fixed released defaults
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-qa-stability-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RUN_RETRIEVAL_ONLY: ${{ inputs.run_retrieval_only || 'false' }}
  RUN_PROMPT_TEST: ${{ inputs.run_prompt_test || 'false' }}

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-install]')
    name: 1/5 Validate and build exact runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install locked benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Validate native integration, decisions, accounting and legacy compatibility
        run: |
          uv run --project benchmarks/swe-qa-bench python -m unittest discover -s benchmarks/swe-qa-bench/tests -v
          node --test benchmarks/swe-qa-bench/scripts/native-replay.test.mjs
      - name: Build released zg 0.2.2 and pinned agents
        run: >-
          docker build -f benchmarks/swe-qa-bench/runtime/Dockerfile
          --build-arg QA_UID="$(id -u)" --build-arg QA_GID="$(id -g)"
          -t zg-native-qa:0.2.2 benchmarks/swe-qa-bench
      - name: Verify the installed MCP SDK over real stdio without a model
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD/benchmarks/swe-qa-bench/scripts",target=/qa-scripts,readonly
          --env ZG_TEST_SDK_ROOT=/opt/qa/node_modules/@zvec/zvec-grep
          zg-native-qa:0.2.2 node --test /qa-scripts/native-replay.test.mjs
      - name: Preserve exact runtime for this experiment (parallel zstd)
        run: docker save zg-native-qa:0.2.2 | zstd -T0 -3 -o "$RUNNER_TEMP/native-runtime.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-runtime.tar.zst
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  screen:
    needs: validate
    name: 2/5 Prompt / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [reflex-6, pylint-9, matplotlib-37, streamlink-14, xarray-32]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - uses: actions/download-artifact@v5
        if: env.RUN_PROMPT_TEST == 'true'
        with:
          name: native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime
      - name: Load exact benchmark runtime
        if: env.RUN_PROMPT_TEST == 'true'
        run: zstd -dc "$RUNNER_TEMP/runtime/native-runtime.tar.zst" | docker load
      - name: Screen with native initial states, source-reviewed query targets and real MCP replay
        id: experiment
        if: env.RUN_PROMPT_TEST == 'true'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.native_benchmark screen
          --case benchmarks/swe-qa-bench/cases/${{ matrix.case }}.json
          --entries benchmarks/swe-qa-bench/cases/${{ matrix.case }}.entries.json
          --output "$RUNNER_TEMP/screen"
      - name: Freeze released MCP description and guidance without a prompt experiment
        id: fixed
        if: env.RUN_PROMPT_TEST != 'true'
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.native_benchmark select-fixed
          --case benchmarks/swe-qa-bench/cases/${{ matrix.case }}.json
          --output "$RUNNER_TEMP/screen"
      - name: Publish screening decision
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/screen/screening-summary.md" ]]; then
            cat "$RUNNER_TEMP/screen/screening-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Scan all retained screening evidence
        id: scan
        if: always() && (steps.experiment.outcome != 'skipped' || steps.fixed.outcome != 'skipped')
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.pipeline_artifacts scan
          --root "$RUNNER_TEMP/screen"
      - name: Package evidence without index or embedding copies
        if: always() && steps.scan.outcome == 'success'
        run: >-
          tar --exclude=model-cache --exclude=corpus --exclude=workspaces
          --exclude=capture-indexes --exclude=workspace
          -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/screen.tar.gz" screen
      - uses: actions/upload-artifact@v7
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-screen-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/screen.tar.gz
            ${{ runner.temp }}/screen/selection.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  e2e:
    needs: [validate, screen]
    name: 3/5 E2E / ${{ matrix.case }} / ${{ matrix.group }} / 10 per arm
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [reflex-6, pylint-9, matplotlib-37, streamlink-14, xarray-32]
        group: [opencode-glm52, opencode-qwen38max]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - uses: actions/download-artifact@v5
        with:
          name: native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime
      - uses: actions/download-artifact@v5
        with:
          name: native-screen-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screen-bundle
      - name: Load image and frozen prompt selection
        run: |
          zstd -dc "$RUNNER_TEMP/runtime/native-runtime.tar.zst" | docker load
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/screen-bundle/screen.tar.gz" screen/selection.json
      - name: Run independent sessions, actual zg install and fresh potionv2 indexes
        id: benchmark
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.native_benchmark run
          --case benchmarks/swe-qa-bench/cases/${{ matrix.case }}.json
          --group "${{ matrix.group }}" --selection "$RUNNER_TEMP/screen/selection.json"
          --output "$RUNNER_TEMP/${{ matrix.group }}"
      - name: Blind answer review and paired quality/cost report
        if: always() && steps.benchmark.outcome != 'skipped'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.native_benchmark review \
            --case benchmarks/swe-qa-bench/cases/${{ matrix.case }}.json \
            --judge-case benchmarks/swe-qa-bench/cases/${{ matrix.case }}.judge-v2.json \
            --output "$RUNNER_TEMP/${{ matrix.group }}"
          cat "$RUNNER_TEMP/${{ matrix.group }}/e2e-ci-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan all retained E2E evidence
        id: scan
        if: always() && steps.benchmark.outcome != 'skipped'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.pipeline_artifacts scan
          --root "$RUNNER_TEMP/${{ matrix.group }}"
      - name: Package all planned outcomes without index reuse
        if: always() && steps.scan.outcome == 'success'
        run: >-
          tar --exclude=model-cache --exclude=corpus --exclude=workspaces
          -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${{ matrix.group }}.tar.gz" "${{ matrix.group }}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-e2e-${{ matrix.case }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.group }}.tar.gz
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  diagnosis:
    needs: [validate, screen, e2e]
    if: always() && needs.screen.result == 'success' && !cancelled()
    name: 4/5 Diagnose / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [reflex-6, pylint-9, matplotlib-37, streamlink-14, xarray-32]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - uses: actions/download-artifact@v5
        if: env.RUN_RETRIEVAL_ONLY == 'true'
        with:
          name: native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime
      - uses: actions/download-artifact@v5
        with:
          pattern: native-e2e-${{ matrix.case }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/evidence
      - name: Load all E2E groups from this experiment
        run: |
          mkdir "$RUNNER_TEMP/recorded"
          for group in opencode-glm52 opencode-qwen38max; do
            tar -C "$RUNNER_TEMP/recorded" -xzf "$RUNNER_TEMP/evidence/$group.tar.gz"
          done
      - name: Load exact runtime for retrieval replay
        if: env.RUN_RETRIEVAL_ONLY == 'true'
        run: zstd -dc "$RUNNER_TEMP/runtime/native-runtime.tar.zst" | docker load
      - name: Build final conclusion with optional source-reviewed retrieval replay
        id: diagnosis
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          retrieval_args=()
          if [[ "$RUN_RETRIEVAL_ONLY" != "true" ]]; then
            retrieval_args+=(--skip-retrieval)
          fi
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.native_benchmark diagnose \
            --case benchmarks/swe-qa-bench/cases/${{ matrix.case }}.json \
            --entries benchmarks/swe-qa-bench/cases/${{ matrix.case }}.entries.json \
            --runs-dir "$RUNNER_TEMP/recorded" --output "$RUNNER_TEMP/diagnosis" "${retrieval_args[@]}"
          cat "$RUNNER_TEMP/diagnosis/benchmark-conclusion.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/diagnosis/retrieval-diagnosis.md" ]]; then
            printf '\n<details><summary>Detailed retrieval rows</summary>\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/diagnosis/retrieval-diagnosis.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n</details>\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nRetrieval-only: **disabled for this run**.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Scan diagnosis evidence
        id: scan
        if: always() && steps.diagnosis.outcome != 'skipped'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa.pipeline_artifacts scan
          --root "$RUNNER_TEMP/diagnosis"
      - name: Package explanation evidence
        if: always() && steps.scan.outcome == 'success'
        run: >-
          tar --exclude=model-cache --exclude=corpus --exclude=workspace
          -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/diagnosis.tar.gz" diagnosis
      - uses: actions/upload-artifact@v7
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-diagnosis-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnosis.tar.gz
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: diagnosis
    if: always() && !cancelled()
    name: 5/5 Aggregate five-case conclusions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: native-diagnosis-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnosis-bundles
      - name: Publish five-case benchmark index
        run: |
          echo "# Five-case native zg benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Fixed cases: reflex-6, pylint-9, matplotlib-37, streamlink-14, xarray-32." >> "$GITHUB_STEP_SUMMARY"
          echo "Each case/model cell contains 10 baseline and 10 zg sessions; at most five E2E cells execute concurrently." >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for case in reflex-6 pylint-9 matplotlib-37 streamlink-14 xarray-32; do
            archive="$RUNNER_TEMP/diagnosis-bundles/native-diagnosis-$case-${{ github.run_id }}-${{ github.run_attempt }}/diagnosis.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "## $case" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "Diagnosis artifact missing; this case is incomplete." >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            mkdir -p "$RUNNER_TEMP/unpacked/$case"
            tar -C "$RUNNER_TEMP/unpacked/$case" -xzf "$archive"
            cat "$RUNNER_TEMP/unpacked/$case/diagnosis/benchmark-conclusion.md" >> "$GITHUB_STEP_SUMMARY"
          done
