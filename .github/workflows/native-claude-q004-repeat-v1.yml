name: Native Claude zvec q004 repetitions v1
run-name: native Claude q004 repetitions / execute=${{ inputs.execute_repeats || false }}
on:
  push:
    branches: [dev/opencode-qa-repair-v2]
    paths:
      - 'benchmarks/native-claude-qa-pilot/architecture-repeat*'
      - 'benchmarks/native-claude-qa-pilot/architecture_repeat*'
      - 'benchmarks/native-claude-qa-pilot/test_architecture_repeat*'
      - '.github/workflows/native-claude-q004-repeat-v1.yml'
  workflow_dispatch:
    inputs:
      execute_repeats:
        description: Execute exactly ten new q004 pairs, baseline10 and zg10
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: native-claude-q004-repeat-v1-${{ github.repository }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'Cuiyus/zvec-grep' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.schedule.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-claude-q004-setup
        with:
          stage: preflight
      - name: Retain new cohort controls
        run: |
          set -euo pipefail
          cp benchmarks/native-claude-qa-pilot/architecture-repeat-plan-v1.json "$REPAIR_ROOT/"
          cp benchmarks/native-claude-qa-pilot/architecture-repeat-decision-v1.json "$REPAIR_ROOT/"
      - name: Verify both profile orders without providers
        id: schedule
        run: |
          set -euo pipefail
          "$MAIN_ROOT/.venv/bin/python" -m unittest discover -s benchmarks/native-claude-qa-pilot -p test_architecture_repeat_v1.py -v 2>&1 | tee "$REPAIR_ROOT/tests.log"
          "$MAIN_ROOT/.venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          import architecture_repeat_v1 as repeat
          root = Path(os.environ['REPAIR_ROOT'])
          for i in (1, 2):
              argv = ['--plan','benchmarks/native-claude-qa-pilot/architecture-repeat-plan-v1.json',
                  '--main-root',os.environ['MAIN_ROOT'],'--reference-prepared',os.environ['REFERENCE_PREPARED_ROOT'],
                  '--prepared-group',os.environ['PREPARED_GROUP_ROOT'],'--candidate',str(root/'zg-install.tgz'),
                  '--output',str(root/f'dry-r{i:02d}'),'--repetition',str(i),'dry-run']
              if repeat.main(argv) != 0:
                  raise SystemExit('dry-run failed')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('matrix='+json.dumps({'include':repeat.schedule()},separators=(',',':'))+'\n')
          PY
      - name: Scan preflight before retention
        id: scan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 benchmarks/native-claude-qa-pilot/repeat_secret_scan_v1.py --secret-env GH_TOKEN --root "$RUNNER_TEMP/native-claude-q004-v1-preflight"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-q004-repeat-v1-${{ github.run_id }}-preflight
          path: ${{ runner.temp }}/native-claude-q004-v1-preflight/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  repeat:
    name: repeat (${{ matrix.key }})
    needs: preflight
    if: github.repository == 'Cuiyus/zvec-grep' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && inputs.execute_repeats == true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-claude-q004-setup
        with:
          stage: pilot
      - name: Retain exact new cohort and pair identity
        env:
          PAIR_KEY: ${{ matrix.key }}
          TRIAL_INDEX: ${{ matrix.trial_index }}
        run: |
          set -euo pipefail
          cp benchmarks/native-claude-qa-pilot/architecture-repeat-plan-v1.json "$REPAIR_ROOT/"
          cp benchmarks/native-claude-qa-pilot/architecture-repeat-decision-v1.json "$REPAIR_ROOT/"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          import architecture_repeat_v1 as repeat
          pair=repeat.selected_pair(int(os.environ['TRIAL_INDEX']))
          assert pair['key']==os.environ['PAIR_KEY']
          with (Path(os.environ['REPAIR_ROOT'])/'scheduled-pair.json').open('x') as f:
              json.dump(pair,f,indent=2);f.write('\n')
          PY
      - name: Execute exactly the scheduled pair
        env:
          ANTHROPIC_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          TRIAL_INDEX: ${{ matrix.trial_index }}
        run: |
          set -euo pipefail
          "$MAIN_ROOT/.venv/bin/python" benchmarks/native-claude-qa-pilot/architecture_repeat_v1.py \
            --plan benchmarks/native-claude-qa-pilot/architecture-repeat-plan-v1.json --repetition "$TRIAL_INDEX" \
            --main-root "$MAIN_ROOT" --reference-prepared "$REFERENCE_PREPARED_ROOT" --prepared-group "$PREPARED_GROUP_ROOT" \
            --candidate "$REPAIR_ROOT/zg-install.tgz" --output "$REPAIR_ROOT/live" run 2>&1 | tee "$REPAIR_ROOT/live.log"
      - name: Collect exact answers and identity even after failure
        if: always()
        env:
          TRIAL_INDEX: ${{ matrix.trial_index }}
        run: |
          set -euo pipefail
          if test -n "${REPAIR_ROOT:-}" && test -f "$REPAIR_ROOT/live-q004-repeat-context.json"; then
            "$MAIN_ROOT/.venv/bin/python" benchmarks/native-claude-qa-pilot/architecture_repeat_v1.py \
              --plan benchmarks/native-claude-qa-pilot/architecture-repeat-plan-v1.json --repetition "$TRIAL_INDEX" \
              --main-root "$MAIN_ROOT" --reference-prepared "$REFERENCE_PREPARED_ROOT" --prepared-group "$PREPARED_GROUP_ROOT" \
              --candidate "$REPAIR_ROOT/zg-install.tgz" --output "$REPAIR_ROOT/live" collect 2>&1 | tee "$REPAIR_ROOT/collect.log"
          fi
      - name: Scan actual secrets before retention
        id: scan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
        run: |
          set -euo pipefail
          python3 benchmarks/native-claude-qa-pilot/repeat_secret_scan_v1.py \
            --secret-env GH_TOKEN --secret-env ANTHROPIC_API_KEY --secret-env ZVEC_GREP_API_KEY --root "$RUNNER_TEMP/native-claude-q004-v1-pilot"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-q004-repeat-v1-${{ github.run_id }}-${{ matrix.key }}
          path: ${{ runner.temp }}/native-claude-q004-v1-pilot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
