name: Windows embedding lifecycle diagnostics

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Fresh processes per mode
        type: number
        default: 20

permissions:
  contents: read

jobs:
  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ZG_DIAG_REPEATS: ${{ inputs.repeats }}
    steps:
      - name: Set probe directories
        shell: pwsh
        run: |
          "ZG_DIAG_OUTPUT=$env:RUNNER_TEMP/embeddinggemma-diag" >> $env:GITHUB_ENV
          "ZVEC_GREP_MODEL_CACHE=$env:RUNNER_TEMP/zvec-grep-model-cache" >> $env:GITHUB_ENV
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v5
        with:
          path: ${{ env.ZVEC_GREP_MODEL_CACHE }}
          key: local-model-v2-${{ runner.os }}-${{ runner.arch }}-local/embeddinggemma-300m-${{ hashFiles('src/engine/models/catalog.ts', 'package-lock.json') }}
      - name: Enable crash dumps for the probe children
        shell: pwsh
        run: |
          $dumpPath = Join-Path $env:ZG_DIAG_OUTPUT 'dumps'
          New-Item -ItemType Directory -Force -Path $dumpPath | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumpPath -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors
          $debugger = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (Test-Path -LiteralPath $debugger) { Write-Output $debugger } else { Write-Output "cdb: not installed" }
      - name: Probe fresh embedding processes
        run: node .github/diagnostics/embedding-lifecycle-driver.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-embedding-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ZG_DIAG_OUTPUT }}/*.json
            ${{ env.ZG_DIAG_OUTPUT }}/*.log
            ${{ env.ZG_DIAG_OUTPUT }}/dumps/**
          retention-days: 7
          compression-level: 6
