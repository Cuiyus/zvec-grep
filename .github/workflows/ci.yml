name: ZG Bench UI demo
run-name: ZG Bench UI demo / PR ${{ inputs.pr_number }} / fixed fixtures
"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number in this repository
        required: true
        type: string
permissions: {}
jobs:
  request:
    if:
      "github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request &&\n github.event.comment.user.type\
      \ != 'Bot' &&\n contains(github.event.comment.body, '@zg-bench'))"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      candidate_sha: ${{ steps.request.outputs.candidate_sha }}
      candidate_repository: ${{ steps.request.outputs.candidate_repository }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      comment_id: ${{ steps.request.outputs.comment_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - uses: actions/github-script@v8
        id: request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: "const { pathToFileURL } = require('node:url');

            const { withDemoBanner } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bench-comment-ui-demo.mjs`));

            withDemoBanner(github);

            const { prepare } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bench-comment.mjs`));

            await prepare({ github, context, core, env: process.env });

            "
  retrieval:
    needs: request
    if: needs.request.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate clearly labelled UI test fixtures
        env:
          BENCH_CANDIDATE_SHA: ${{ needs.request.outputs.candidate_sha }}
          BENCH_FIXTURE_KIND: retrieval
        run: node .github/scripts/bench-comment-ui-demo.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-results
          path: ${{ runner.temp }}/ui-fixture/
          if-no-files-found: error
          retention-days: 1
  e2e:
    needs: request
    if: needs.request.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate clearly labelled UI test fixtures
        env:
          BENCH_CANDIDATE_SHA: ${{ needs.request.outputs.candidate_sha }}
          BENCH_FIXTURE_KIND: e2e
        run: node .github/scripts/bench-comment-ui-demo.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: swe-qa-aggregate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-fixture/
          if-no-files-found: error
          retention-days: 1
  reply:
    needs:
      - request
      - retrieval
      - e2e
    if: always() && needs.request.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - name: Download Retrieval results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: retrieval-results
          path: ${{ runner.temp }}/bench-reports/retrieval
      - name: Download e2e results, including successful jobs from earlier attempts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: swe-qa-aggregate-report-${{ github.run_id }}-*
          path: ${{ runner.temp }}/bench-reports/e2e
      - name: Update the Benchmark comment
        uses: actions/github-script@v8
        env:
          BENCH_NEEDS: ${{ toJSON(needs) }}
          BENCH_REPORTS: ${{ runner.temp }}/bench-reports
          BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: "const { pathToFileURL } = require('node:url');

            const { withDemoBanner } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bench-comment-ui-demo.mjs`));

            withDemoBanner(github);

            const { finish } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bench-comment.mjs`));

            await finish({ github, context, core, env: process.env });

            "
