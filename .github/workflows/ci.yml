name: Windows AMX allocator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocator:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and test the actual old AMX allocator before and after the fix
        shell: pwsh
        run: .github/diagnostics/build-amx-regression.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: amx-native-validation
          path: |
            ${{ runner.temp }}/amx-validation/allocator-results.json
            ${{ runner.temp }}/amx-validation/llama-source-sha.txt
            ${{ runner.temp }}/amx-validation/tested-source.diff
            ${{ runner.temp }}/amx-validation/*.log
            ${{ runner.temp }}/amx-validation/original/*.dll
            ${{ runner.temp }}/amx-validation/patched/*.dll
          retention-days: 7
  model:
    needs: allocator
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        host: [1, 2, 3, 4, 5, 6, 7, 8]
    name: AMX model same-host A/B ${{ matrix.host }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ZG_DIAG_EXPECTED_RUNTIME: 3.18.1
    steps:
      - name: Detect eligible AMX host
        id: cpu
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor).Name
          Write-Output $cpu
          if ($cpu -match '8573C') { "eligible=true" >> $env:GITHUB_OUTPUT } else { "eligible=false" >> $env:GITHUB_OUTPUT }
          "ZG_DIAG_OUTPUT=$env:RUNNER_TEMP/amx-model-ab" >> $env:GITHUB_ENV
          "ZVEC_GREP_MODEL_CACHE=$env:RUNNER_TEMP/zvec-grep-model-cache" >> $env:GITHUB_ENV
          "AMX_DLL_ARTIFACT=$env:RUNNER_TEMP/amx-dll" >> $env:GITHUB_ENV
          "CPU: $cpu; eligible for real AMX model test: $($cpu -match '8573C')" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/checkout@v6
        if: steps.cpu.outputs.eligible == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: steps.cpu.outputs.eligible == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v8
        if: steps.cpu.outputs.eligible == 'true'
        with:
          name: amx-native-validation
          path: ${{ env.AMX_DLL_ARTIFACT }}
      - run: npm ci
        if: steps.cpu.outputs.eligible == 'true'
      - run: npm run build
        if: steps.cpu.outputs.eligible == 'true'
      - uses: actions/cache@v5
        if: steps.cpu.outputs.eligible == 'true'
        with:
          path: ${{ env.ZVEC_GREP_MODEL_CACHE }}
          key: amx-model-${{ runner.os }}-${{ runner.arch }}-embeddinggemma-300m
          restore-keys: local-model-v2-${{ runner.os }}-${{ runner.arch }}-local/embeddinggemma-300m-
      - name: Compare published, rebuilt original, and patched AMX backend on the same host
        if: steps.cpu.outputs.eligible == 'true'
        run: node .github/diagnostics/amx-model-ab.mjs
      - uses: actions/upload-artifact@v7
        if: always() && steps.cpu.outputs.eligible == 'true'
        with:
          name: amx-model-host-${{ matrix.host }}
          path: |
            ${{ env.ZG_DIAG_OUTPUT }}/*.json
            ${{ env.ZG_DIAG_OUTPUT }}/*.log
          retention-days: 7
