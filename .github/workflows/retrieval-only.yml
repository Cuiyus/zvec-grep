name: PR 385 FTS chunk diagnosis

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        required: true
        type: string
      embedding:
        default: local
        type: choice
        options: [local, remote]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
      - uses: ./.github/actions/rust-candidate-package
        with:
          candidate_repository: ${{ github.repository }}
          candidate_ref: ${{ inputs.candidate_ref }}
          cache_namespace: retrieval-fts-diagnostic
      - name: Compare chunk budgets with the same Potion model
        run: |
          node benchmarks/zg-retrieval/fts-chunk-probe.mjs "$RUNNER_TEMP/rust-package-cache/candidate.tgz" "$RUNNER_TEMP/fts-probe"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fts-chunk-probe
          path: ${{ runner.temp }}/fts-probe/evidence/
          if-no-files-found: warn
          retention-days: 14
